<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Edit · RIVLUM</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Atkinson Hyperlegible', sans-serif; padding-bottom: 5rem; }

    .free-close {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      font-size: 1.2rem;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .free-close:active { transform: scale(0.95); }

    .free-header {
      text-align: center;
      padding: 3.5rem 1rem 1rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .free-header h2 {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: var(--accent);
      margin: 0 0 0.25rem;
    }
    .free-header p {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0;
    }

    /* Daily Mood */
    .mood-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.3rem 0.85rem;
      font-size: 0.82rem;
      color: var(--text);
      margin-top: 0.5rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .mood-pill:hover { border-color: var(--accent); }
    .mood-pill .mood-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--gold-bg);
      border: 1px solid var(--gold);
      color: var(--text);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.78rem;
      margin-top: 0.35rem;
      margin-left: 0.35rem;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 1rem auto;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .canvas-wrap canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .upload-area {
      max-width: 500px;
      margin: 0.5rem auto;
      padding: 0 1rem;
    }
    .upload-btn {
      width: 100%;
      padding: 0.65rem;
      border: 2px dashed var(--border);
      border-radius: 10px;
      background: var(--bg2);
      color: var(--muted);
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.88rem;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s;
      display: block;
    }
    .upload-btn:hover { border-color: var(--accent); }
    .upload-btn input { display: none; }

    .preset-row {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding: 0.5rem 1rem;
      max-width: 520px;
      margin: 0 auto;
      scrollbar-width: none;
    }
    .preset-row::-webkit-scrollbar { display: none; }
    .preset-chip {
      flex-shrink: 0;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.78rem;
      cursor: pointer;
      font-family: 'Atkinson Hyperlegible', sans-serif;
      transition: border-color 0.15s;
    }
    .preset-chip:hover { border-color: var(--accent); }

    .controls {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    .control-group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 1px 6px var(--shadow);
    }
    .control-group h4 {
      font-family: 'Caveat', cursive;
      font-size: 1.15rem;
      color: var(--accent);
      margin: 0 0 0.6rem;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-row label {
      width: 72px;
      font-size: 0.82rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
    }
    .slider-row .val {
      width: 32px;
      text-align: right;
      font-size: 0.78rem;
      color: var(--text);
      font-family: monospace;
    }
    .blend-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .blend-row label {
      width: 72px;
      font-size: 0.82rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .blend-row select {
      flex: 1;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
    }

    .sticker-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .sticker-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, transform 0.1s;
    }
    .sticker-btn:hover { border-color: var(--accent); transform: scale(1.1); }
    .sticker-btn:active { transform: scale(0.95); }

    .text-controls { display: flex; flex-direction: column; gap: 0.5rem; }
    .text-controls input[type="text"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.9rem;
    }
    .color-dots { display: flex; gap: 0.4rem; }
    .color-dot {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .color-dot:hover { transform: scale(1.15); }
    .color-dot.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

    .action-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      max-width: 500px;
      margin: 1rem auto;
      padding: 0 1rem;
    }
    .action-btn {
      flex: 1;
      min-width: 80px;
      padding: 0.7rem 0.4rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, transform 0.1s;
    }
    .action-btn:hover { background: var(--bg2); }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .action-btn.primary:hover { opacity: 0.9; }
    .action-btn.gold {
      background: var(--gold);
      color: var(--text);
      border-color: var(--gold);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      z-index: 500;
      max-width: 90%;
      text-align: center;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

    <div class="control-group">
      <h4>🎨 Color</h4>
      <div class="slider-row"><label>Temperature</label><input type="range" min="-100" max="100" value="0" data-key="temperature"><span class="val">0</span></div>
      <div class="slider-row"><label>Tint</label><input type="range" min="-100" max="100" value="0" data-key="tint"><span class="val">0</span></div>
      <div class="slider-row"><label>Saturation</label><input type="range" min="-100" max="100" value="0" data-key="saturation"><span class="val">0</span></div>

      <div class="slider-row"><label>Clarity</label><input type="range" min="-100" max="100" value="0" data-key="clarity"><span class="val">0</span></div>
      <div class="slider-row"><label>Vignette</label><input type="range" min="0" max="100" value="0" data-key="vignette"><span class="val">0</span></div>
      <div class="slider-row"><label>Grain</label><input type="range" min="0" max="100" value="0" data-key="grain"><span class="val">0</span></div>

    <div class="control-group">
      <h4>✨ Stickers</h4>

        <button class="sticker-btn" data-sticker="⚡">⚡</button>
        <button class="sticker-btn" data-sticker="🕶️">🕶️</button>
        <button class="sticker-btn" data-sticker="☁️">☁️</button>
        <button class="sticker-btn" data-sticker="🔥">🔥</button>
        <button class="sticker-btn" data-sticker="🎨">🎨</button>
      </div>
    </div>

    <div class="control-group">
      <h4>💬 Text Overlay</h4>
      <div class="text-controls">
        <input type="text" id="textInput" placeholder="type something pretty..." maxlength="40">
        <div class="color-dots">
          <span class="color-dot active" data-color="#FFFFFF" style="background:#FFFFFF;"></span>
          <span class="color-dot" data-color="#2D312E" style="background:#2D312E;"></span>
          <span class="color-dot" data-color="#F2C94C" style="background:#F2C94C;"></span>

    <div class="control-group">

  </div>

  <!-- Actions -->
  <div class="action-bar">
    <button class="action-btn" id="undoBtn">↩️ Undo</button>
    <button class="action-btn" id="redoBtn">↪️ Redo</button>

  <script>
    /* ========== GRAIN TEXTURE ========== */
    var grainCanvas = (function() {
      var c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      var cx = c.getContext('2d');
      var d = cx.createImageData(256, 256);
      for (var i = 0; i < d.data.length; i += 4) {
        var v = Math.random() * 255;
        d.data[i] = v; d.data[i+1] = v; d.data[i+2] = v; d.data[i+3] = 255;
      }
      cx.putImageData(d, 0, 0);
      return c;
    })();

    /* ========== DAILY MOOD ========== */
    var MOODS = [
      { name: 'Golden Hour', emoji: '🌅', color: '#F2C94C', sliders: { exposure: 15, contrast: 20, highlights: -10, shadows: 15, temperature: 45, tint: -5, saturation: 20, vibrance: 30, clarity: 10, vignette: 20, grain: 8 } },
      { name: 'Midnight Blue', emoji: '🌙', color: '#6C8EA4', sliders: { exposure: -15, contrast: 35, highlights: -30, shadows: 40, temperature: -35, tint: -15, saturation: -10, vibrance: 5, clarity: 30, vignette: 45, grain: 20 } },
      { name: 'Dreamscape', emoji: '☁️', color: '#C4A8D4', sliders: { exposure: 25, contrast: -20, highlights: 35, shadows: 20, temperature: -5, tint: 20, saturation: -15, vibrance: 25, clarity: -25, vignette: 10, grain: 12 } },
      { name: 'Storm', emoji: '⛈️', color: '#5A6672', sliders: { exposure: -25, contrast: 45, highlights: -35, shadows: 55, temperature: -20, tint: -5, saturation: -25, vibrance: -10, clarity: 40, vignette: 50, grain: 30 } },
      { name: 'Electric', emoji: '⚡', color: '#E86B6B', sliders: { exposure: 10, contrast: 50, highlights: 15, shadows: 25, temperature: 10, tint: 25, saturation: 55, vibrance: 45, clarity: 40, vignette: 15, grain: 5 } },
      { name: 'Nostalgia', emoji: '📼', color: '#C4956A', sliders: { exposure: -5, contrast: -15, highlights: -20, shadows: -10, temperature: 30, tint: 8, saturation: -25, vibrance: -5, clarity: -10, vignette: 30, grain: 35 } },
      { name: 'Spring Meadow', emoji: '🌿', color: '#5B8266', sliders: { exposure: 10, contrast: 15, highlights: 5, shadows: 10, temperature: -8, tint: 20, saturation: 25, vibrance: 35, clarity: 20, vignette: 10, grain: 8 } }
    ];

    function getDailyMood() {
      var d = new Date();
      var dayOfYear = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
      return MOODS[dayOfYear % MOODS.length];
    }

    function renderMood() {
      var mood = getDailyMood();
      var wrap = document.getElementById('moodWrap');
      wrap.innerHTML = '<button class="mood-pill" id="moodBtn"><span class="mood-dot" style="background:' + mood.color + '"></span>today\'s mood: ' + mood.emoji + ' ' + mood.name + '</button>';
      document.getElementById('moodBtn').addEventListener('click', function() {
        var m = getDailyMood();
        Object.keys(m.sliders).forEach(function(k) {
          if (state.hasOwnProperty(k)) state[k] = m.sliders[k];
        });
        syncUIFromState();
        renderCanvas();
        pushHistory();
        showToast(mood.emoji + ' applied today\'s mood!');
      });
    }
    renderMood();

    /* ========== DRIFT CHAIN ========== */
    function updateStreak() {
      var today = new Date().toDateString();
      var last = localStorage.getItem('rivlum_last_edit');
      var streak = parseInt(localStorage.getItem('rivlum_streak') || '0');
      if (last !== today) {
        var yesterday = new Date(Date.now() - 86400000).toDateString();
        streak = (last === yesterday) ? streak + 1 : 1;
        localStorage.setItem('rivlum_streak', streak);
        localStorage.setItem('rivlum_last_edit', today);
      }
      renderStreak();
    }
    function renderStreak() {
      var streak = parseInt(localStorage.getItem('rivlum_streak') || '0');
      var wrap = document.getElementById('streakWrap');
      wrap.innerHTML = streak > 0 ? '<span class="streak-pill">🔥 ' + streak + '-day drift chain</span>' : '';
    }
    renderStreak();

    /* ========== PRESETS ========== */
    var PRESETS = {
      reset: { exposure: 0, contrast: 0, highlights: 0, shadows: 0, temperature: 0, tint: 0, saturation: 0, vibrance: 0, clarity: 0, vignette: 0, grain: 0 },
      dreamy: { exposure: 25, contrast: -15, highlights: 35, shadows: 20, temperature: -8, tint: 15, saturation: -15, vibrance: 25, clarity: -25, vignette: 10, grain: 12 },
      golden: { exposure: 15, contrast: 20, highlights: -10, shadows: 15, temperature: 45, tint: -5, saturation: 20, vibrance: 30, clarity: 10, vignette: 20, grain: 8 },
      moody: { exposure: -15, contrast: 40, highlights: -30, shadows: 45, temperature: -25, tint: -10, saturation: -15, vibrance: 5, clarity: 35, vignette: 45, grain: 22 },
      vintage: { exposure: -5, contrast: -15, highlights: -20, shadows: -10, temperature: 25, tint: 8, saturation: -25, vibrance: -5, clarity: -10, vignette: 30, grain: 35 }
    };

    /* ========== COMPLIMENTS ========== */
    var COMPLIMENTS = [
      '✨ saved! this one is beautiful',
      '🌿 oh wow, that\'s a mood',
      '💛 ur eye for light is unreal',
      '🌊 saved to your drifts — gorgeous',
      '🌅 the colors in this one... stunning',
      '✨ this one feels like a feeling',
      '🎨 saved! you\'re cooking',
      '🌙 effortlessly cinematic — nice',
      '⭐ saved, and it\'s a vibe',
      '🌸 soft, strong, perfect — saved',
      '🔥 ok this one goes hard — saved',
      '☁️ dreamy and delicate — love it'
    ];

    /* ========== STATE ========== */
    var canvas = document.getElementById('mainCanvas');
    var ctx = canvas.getContext('2d');
    var baseImg = new Image();
    baseImg.crossOrigin = 'anonymous';
    var defaultImg = 'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=800&q=80';

    var state = {
      exposure: 0, contrast: 0, highlights: 0, shadows: 0,
      temperature: 0, tint: 0, saturation: 0, vibrance: 0,
      clarity: 0, vignette: 0, grain: 0,
      blendMode: 'overlay', rotation: 0,
      stickers: [], textOverlay: '', textColor: '#FFFFFF'
    };

    var history = [];
    var historyIndex = -1;
    var MAX_HISTORY = 20;

    /* ========== LOAD IMAGE ========== */
    function loadImage(src) {
      baseImg.onload = function() {
        canvas.width = baseImg.naturalWidth;
        canvas.height = baseImg.naturalHeight;
        pushHistory();
        requestAnimationFrame(renderCanvas);
        setTimeout(renderCanvas, 50);
        setTimeout(renderCanvas, 200);
      };
      baseImg.onerror = function() {
        canvas.width = 800; canvas.height = 600;
        ctx.fillStyle = '#EAE4DC';
        ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = '#6E7570';
        ctx.font = '18px Atkinson Hyperlegible';
        ctx.textAlign = 'center';
        ctx.fillText('image could not load :(', 400, 300);
      };
      baseImg.src = src;
    }

    /* ========== RENDER ========== */
    function renderCanvas() {
      if (!baseImg.complete || !baseImg.naturalWidth) return;
      var w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.save();

      if (state.rotation !== 0) {
        ctx.translate(w/2, h/2);
        ctx.rotate(state.rotation * Math.PI / 180);
        ctx.translate(-w/2, -h/2);
      }

      var brightness = 1 + (state.exposure / 100) * 0.5;
      var contrast = 1 + (state.contrast / 100) * 0.5;
      var saturate = 1 + (state.saturation / 100) * 0.8;
      var hueRotate = (state.temperature / 100) * 30;
      var blur = Math.abs(state.clarity) > 50 ? (Math.abs(state.clarity) - 50) / 100 : 0;
      var fs = 'brightness('+brightness+') contrast('+contrast+') saturate('+saturate+') hue-rotate('+hueRotate+'deg)';
      if (blur > 0) fs += ' blur('+blur+'px)';
      ctx.filter = fs;
      ctx.drawImage(baseImg, 0, 0, w, h);
      ctx.filter = 'none';

      if (Math.abs(state.tint) > 2) {
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = Math.abs(state.tint) / 100 * 0.3;
        ctx.fillStyle = state.tint > 0 ? '#ff66cc' : '#66ff99';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
      if (state.highlights > 5) {
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = state.highlights / 100 * 0.25;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
      if (state.shadows > 5) {
        ctx.globalCompositeOperation = 'multiply';
        ctx.globalAlpha = state.shadows / 100 * 0.3;
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
      if (Math.abs(state.vibrance) > 5) {
        ctx.globalCompositeOperation = 'saturation';
        ctx.globalAlpha = Math.abs(state.vibrance) / 100 * 0.3;
        ctx.fillStyle = state.vibrance > 0 ? '#808080' : '#404040';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
      if (state.vignette > 2) {
        var vA = state.vignette / 100 * 0.7;
        var g = ctx.createRadialGradient(w/2, h/2, w*0.25, w/2, h/2, w*0.75);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,'+vA+')');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }
      if (state.grain > 2) {
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = (state.grain / 100) * 0.3;
        ctx.fillStyle = ctx.createPattern(grainCanvas, 'repeat');
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }

      ctx.restore();

      var stickerSize = Math.max(w, h) * 0.08;
      ctx.font = stickerSize + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      state.stickers.forEach(function(s) {
        ctx.fillText(s.emoji, s.x * w, s.y * h);
      });

      if (state.textOverlay) {
        var fontSize = Math.max(w, h) * 0.05;
        ctx.font = 'bold ' + fontSize + 'px Atkinson Hyperlegible, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillText(state.textOverlay, w/2 + 2, h - 30 + 2);
        ctx.fillStyle = state.textColor;
        ctx.fillText(state.textOverlay, w/2, h - 30);
      }
    }

    /* ========== UI SYNC ========== */
    function syncUIFromState() {
      document.querySelectorAll('input[type="range"]').forEach(function(sl) {
        var k = sl.getAttribute('data-key');
        if (state.hasOwnProperty(k)) {
          sl.value = state[k];
          var v = sl.parentElement.querySelector('.val');
          if (v) v.textContent = k === 'rotation' ? state[k] + '°' : state[k];
        }
      });
      document.getElementById('blendMode').value = state.blendMode;
      document.getElementById('textInput').value = state.textOverlay;
      document.querySelectorAll('.color-dot').forEach(function(d) {
        d.classList.toggle('active', d.getAttribute('data-color') === state.textColor);
      });
    }

    function readUI() {
      document.querySelectorAll('input[type="range"]').forEach(function(sl) {
        var k = sl.getAttribute('data-key');
        if (state.hasOwnProperty(k)) state[k] = parseInt(sl.value);
      });
      state.blendMode = document.getElementById('blendMode').value;
      state.textOverlay = document.getElementById('textInput').value;
    }

    /* ========== HISTORY ========== */
    function pushHistory() {
      var snap = JSON.parse(JSON.stringify(state));
      if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
      history.push(snap);
      if (history.length > MAX_HISTORY) history.shift();
      historyIndex = history.length - 1;
    }
    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        state = JSON.parse(JSON.stringify(history[historyIndex]));
        syncUIFromState();
        renderCanvas();
      }
    }
    function redo() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        state = JSON.parse(JSON.stringify(history[historyIndex]));
        syncUIFromState();
        renderCanvas();
      }
    }

    /* ========== TOAST ========== */
    var toast = document.getElementById('toast');
    var toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2800);
    }

    /* ========== SAVE ========== */
    function saveDrift() {
      try {
        var drifts = JSON.parse(localStorage.getItem('rivlum_drifts') || '[]');
        drifts.unshift({
          date: new Date().toISOString(),
          challenge: 'free',
          sliders: {
            exposure: state.exposure, contrast: state.contrast,
            highlights: state.highlights, shadows: state.shadows,
            temperature: state.temperature, tint: state.tint,
            saturation: state.saturation, vibrance: state.vibrance,
            clarity: state.clarity, vignette: state.vignette, grain: state.grain
          },
          blendMode: state.blendMode,
          rotation: state.rotation,
          stickers: state.stickers,
          textOverlay: state.textOverlay,
          textColor: state.textColor,
          image: canvas.toDataURL('image/jpeg', 0.7)
        });
        if (drifts.length > 30) drifts = drifts.slice(0, 30);
        localStorage.setItem('rivlum_drifts', JSON.stringify(drifts));
        if (!localStorage.getItem('rivlum_born')) {
          localStorage.setItem('rivlum_born', Date.now());
        }
        updateStreak();
        var msg = COMPLIMENTS[Math.floor(Math.random() * COMPLIMENTS.length)];
        showToast(msg);
      } catch(e) {
        showToast('💛 saved! (storage almost full tho)');
      }
    }

    /* ========== EVENTS ========== */
    document.querySelectorAll('input[type="range"]').forEach(function(sl) {
      sl.addEventListener('input', function() {
        var k = this.getAttribute('data-key');
        var v = this.parentElement.querySelector('.val');
        if (v) v.textContent = k === 'rotation' ? this.value + '°' : this.value;
        readUI();
        renderCanvas();
      });
      sl.addEventListener('change', pushHistory);
    });

    document.getElementById('blendMode').addEventListener('change', function() {
      readUI(); renderCanvas(); pushHistory();
    });
    document.getElementById('textInput').addEventListener('input', function() {
      readUI(); renderCanvas();
    });
    document.getElementById('textInput').addEventListener('change', pushHistory);

    document.querySelectorAll('.color-dot').forEach(function(d) {
      d.addEventListener('click', function() {
        document.querySelectorAll('.color-dot').forEach(function(x) { x.classList.remove('active'); });
        this.classList.add('active');
        state.textColor = this.getAttribute('data-color');
        renderCanvas(); pushHistory();
      });
    });

    document.querySelectorAll('.sticker-btn').forEach(function(b) {
      b.addEventListener('click', function() {
        state.stickers.push({
          emoji: this.getAttribute('data-sticker'),
          x: 0.3 + Math.random() * 0.4,
          y: 0.3 + Math.random() * 0.4
        });
        renderCanvas(); pushHistory();
      });
    });

    canvas.addEventListener('click', function(e) {
      if (!state.stickers.length) return;
      var r = canvas.getBoundingClientRect();
      state.stickers[state.stickers.length - 1].x = (e.clientX - r.left) / r.width;
      state.stickers[state.stickers.length - 1].y = (e.clientY - r.top) / r.height;
      renderCanvas();
    });

    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('redoBtn').addEventListener('click', redo);
    document.getElementById('saveBtn').addEventListener('click', saveDrift);

    /* Presets */
    document.querySelectorAll('.preset-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        var p = PRESETS[this.getAttribute('data-preset')];
        if (!p) return;
        Object.keys(p).forEach(function(k) {
          if (state.hasOwnProperty(k)) state[k] = p[k];
        });
        syncUIFromState();
        renderCanvas();
        pushHistory();
        showToast('🎨 preset applied!');
      });
    });

    /* File Upload */
    document.getElementById('fileInput').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) { loadImage(ev.target.result); };
      reader.readAsDataURL(file);
    });

    /* Export */
    document.getElementById('exportBtn').addEventListener('click', function() {
      var ec = document.createElement('canvas');
      ec.width = canvas.width; ec.height = canvas.height;
      var ex = ec.getContext('2d');
      ex.drawImage(canvas, 0, 0);
      var w = ec.width, h = ec.height;
      var pH = Math.max(28, h * 0.04);
      var pP = pH * 0.5;
      ex.font = 'bold ' + (pH * 0.55) + 'px Atkinson Hyperlegible, sans-serif';
      var tw = ex.measureText('✨ Made with RIVLUM').width;
      var pW = tw + pP * 2;
      var px = w - pW - pP, py = h - pH - pP;
      ex.save();
      ex.globalAlpha = 0.6;
      if (ex.roundRect) {
        ex.beginPath(); ex.roundRect(px, py, pW, pH, pH / 2);
        ex.fillStyle = '#2D312E'; ex.fill();
      } else {
        ex.fillStyle = '#2D312E'; ex.fillRect(px, py, pW, pH);
      }
      ex.globalAlpha = 0.9;
      ex.fillStyle = '#FFFFFF';
      ex.textAlign = 'left'; ex.textBaseline = 'middle';
      ex.fillText('✨ Made with RIVLUM', px + pP, py + pH / 2);
      ex.restore();
      var link = document.createElement('a');
      link.download = 'rivlum-free-edit.png';
      link.href = ec.toDataURL('image/png');
      link.click();
      showToast('⬇️ exported — looks amazing');
    });

    /* ========== INIT ========== */
    var params = new URLSearchParams(window.location.search);
    if (params.get('restore') === '1') {
      try {
        var saved = JSON.parse(localStorage.getItem('rivlum_restore'));
        if (saved && saved.sliders) {
          Object.keys(saved.sliders).forEach(function(k) {
            if (state.hasOwnProperty(k)) state[k] = saved.sliders[k];
          });
          if (saved.blendMode) state.blendMode = saved.blendMode;
          if (saved.rotation !== undefined) state.rotation = saved.rotation;
          if (saved.stickers) state.stickers = saved.stickers;
          if (saved.textOverlay) state.textOverlay = saved.textOverlay;
          if (saved.textColor) state.textColor = saved.textColor;
          syncUIFromState();
          showToast('🔄 restored your last edit!');
        }
      } catch(e) {}
    }

    loadImage(defaultImg);
  </script>

</body>
</html>
