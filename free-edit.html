<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIVLUM — Free Edit</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { font-family: 'Atkinson Hyperlegible', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#FBF8F3; color:#2D312E; margin:0; padding:0; padding-bottom:80px; }
  .wrap { max-width:900px; margin:0 auto; padding:12px; }
  .sticky-top { position:sticky; top:0; background:#FBF8F3; z-index:50; padding:8px 0; border-bottom:1px solid #EAE4DC; }
  .canvas-frame { width:100%; height:25vh; display:flex; align-items:center; justify-content:center; background:#fff; border-radius:12px; overflow:hidden; border:1px solid #EAE4DC; }
  .canvas-frame canvas { max-width:100%; max-height:100%; object-fit:contain; }
  .action-bar { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .btn { padding:6px 12px; border-radius:7px; border:1px solid #EAE4DC; background:#fff; cursor:pointer; font-size:0.85rem; font-family:inherit; }
  .btn-primary { background:#5B8266; color:#fff; border:none; }
  .btn-accent { background:#D97D54; color:#fff; border:none; }
  .btn:disabled { opacity:0.4; cursor:not-allowed; }
  .sliders-panel { padding:12px 0; }
  .slider-group { margin-bottom:14px; }
  .slider-group label { display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:4px; color:#2D312E; }
  .slider-group input[type="range"] { width:100%; }
  .section-title { font-weight:bold; color:#5B8266; font-size:0.9rem; margin:14px 0 8px; }
  .text-overlay-panel { background:#fff; border:1px solid #EAE4DC; border-radius:10px; padding:10px; margin:8px 0; font-size:0.85rem; }
  .colorChip { width:22px; height:22px; border-radius:50%; cursor:pointer; }
  .upload-btn { display:inline-block; padding:7px 14px; background:#6C8EA4; color:#fff; border-radius:7px; cursor:pointer; margin-bottom:8px; font-size:0.85rem; }
  input[type="file"] { display:none; }
  .preset-row { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  .preset-chip { padding:5px 10px; background:#FFF6D6; border:1px solid #F2C94C; border-radius:16px; cursor:pointer; font-size:0.78rem; }
  @media (min-width:800px) {
    .wrap { display:grid; grid-template-columns:1.2fr 1fr; gap:20px; max-width:1100px; }
    .sticky-top { position:sticky; top:12px; height:fit-content; }
    .canvas-frame { height:50vh; }
    .sliders-panel { max-height:85vh; overflow-y:auto; padding-right:8px; }
  }
  .nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #EAE4DC; display:flex; justify-content:space-around; padding:8px 0; z-index:100; }
  .nav a { text-decoration:none; color:#5B8266; font-size:0.75rem; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .nav a span { font-size:1.2rem; }
</style>
</head>
<body>

<div class="wrap">
  <div class="sticky-top">
    <div class="canvas-frame">
      <canvas id="editorCanvas"></canvas>
    </div>

    <label for="uploadInput" class="upload-btn">📸 Upload Your Photo</label>
    <input type="file" id="uploadInput" accept="image/*">

    <div class="preset-row">
      <span class="preset-chip" onclick="applyPreset('golden')">🌅 Golden</span>
      <span class="preset-chip" onclick="applyPreset('moody')">🌌 Moody</span>
      <span class="preset-chip" onclick="applyPreset('vintage')">📼 Vintage</span>
      <span class="preset-chip" onclick="applyPreset('dream')">☁️ Dream</span>
    </div>

    <div class="action-bar">
      <button id="undoBtn" class="btn" onclick="undoEdit()" disabled>↺ Undo</button>
      <button id="redoBtn" class="btn" onclick="redoEdit()" disabled>↻ Redo</button>
      <button class="btn" onclick="resetSliders()">Reset</button>
      <button class="btn btn-primary" onclick="saveDrift()">💾 Save</button>
      <button class="btn" onclick="exportWatermarkedImage()">⬇ Download</button>
      <button class="btn" onclick="shareEdit()">📱 Share</button>
    </div>

    <div class="text-overlay-panel">
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
        <strong style="color:#5B8266;">✍️ Add Text</strong>
        <button onclick="toggleTextPanel()" style="margin-left:auto; background:none; border:none; cursor:pointer; font-size:1rem;">▾</button>
      </div>
      <div id="textPanelBody" style="display:none;">
        <input type="text" id="overlayText" placeholder="Type your caption..." maxlength="50"
          style="width:100%; padding:6px 8px; border:1px solid #EAE4DC; border-radius:6px; margin-bottom:6px; font-family:inherit;">
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;">
          <label style="font-size:0.8rem;">Size:
            <select id="textSize" style="padding:3px 6px; border-radius:5px; border:1px solid #EAE4DC;">
              <option value="24">Small</option>
              <option value="40" selected>Medium</option>
              <option value="60">Large</option>
              <option value="90">Banner</option>
            </select>
          </label>
          <label style="font-size:0.8rem;">Position:
            <select id="textPos" style="padding:3px 6px; border-radius:5px; border:1px solid #EAE4DC;">
              <option value="top">Top</option>
              <option value="center" selected>Center</option>
              <option value="bottom">Bottom</option>
            </select>
          </label>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
          <span style="font-size:0.8rem;">Color:</span>
          <button class="colorChip" data-color="#FFFFFF" style="background:#fff; border:2px solid #ccc;"></button>
          <button class="colorChip" data-color="#2D312E" style="background:#2D312E; border:2px solid transparent;"></button>
          <button class="colorChip" data-color="#F2C94C" style="background:#F2C94C; border:2px solid transparent;"></button>
          <button class="colorChip" data-color="#5B8266" style="background:#5B8266; border:2px solid transparent;"></button>
          <button class="colorChip" data-color="#D97D54" style="background:#D97D54; border:2px solid transparent;"></button>
          <button onclick="clearOverlayText()" style="margin-left:auto; background:#f5f5f5; border:1px solid #ddd; padding:3px 8px; border-radius:5px; font-size:0.75rem; cursor:pointer;">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <div class="sliders-panel">
    <div class="section-title">☀️ Light</div>
    <div class="slider-group"><label>Exposure <span id="val-exposure">0</span></label><input type="range" id="exposure" min="-100" max="100" value="0" data-default="0"></div>
    <div class="slider-group"><label>Contrast <span id="val-contrast">0</span></label><input type="range" id="contrast" min="-100" max="100" value="0" data-default="0"></div>
    <div class="slider-group"><label>Highlights <span id="val-highlights">0</span></label><input type="range" id="highlights" min="-100" max="100" value="0" data-default="0"></div>
    <div class="slider-group"><label>Shadows <span id="val-shadows">0</span></label><input type="range" id="shadows" min="-100" max="100" value="0" data-default="0"></div>

    <div class="section-title">🎨 Color</div>
    <div class="slider-group"><label>Temperature <span id="val-temp">0</span></label><input type="range" id="temp" min="-100" max="100" value="0" data-default="0"></div>
    <div class="slider-group"><label>Tint <span id="val-tint">0</span></label><input type="range" id="tint" min="-100" max="100" value="0" data-default="0"></div>
    <div class="slider-group"><label>Saturation <span id="val-saturation">0</span></label><input type="range" id="saturation" min="-100" max="100" value="0" data-default="0"></div>
    <div class="slider-group"><label>Vibrance <span id="val-vibrance">0</span></label><input type="range" id="vibrance" min="-100" max="100" value="0" data-default="0"></div>

    <div class="section-title">✨ Texture</div>
    <div class="slider-group"><label>Clarity <span id="val-clarity">0</span></label><input type="range" id="clarity" min="-100" max="100" value="0" data-default="0"></div>
    <div class="slider-group"><label>Vignette <span id="val-vignette">0</span></label><input type="range" id="vignette" min="0" max="100" value="0" data-default="0"></div>
  </div>
</div>

<nav class="nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="challenge.html"><span>✨</span>Edit</a>
  <a href="free-edit.html"><span>📸</span>Free</a>
  <a href="constellation.html"><span>🌌</span>Sky</a>
  <a href="about.html"><span>💛</span>About</a>
</nav>

<script>
const canvas = document.getElementById('editorCanvas');
const ctx = canvas.getContext('2d');
let currentImage = new Image();
currentImage.crossOrigin = "anonymous";

currentImage.onload = () => {
  canvas.width = currentImage.naturalWidth;
  canvas.height = currentImage.naturalHeight;
  renderImage();
};
currentImage.src = "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800";

document.getElementById('uploadInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => { currentImage.src = ev.target.result; };
  reader.readAsDataURL(file);
});

const sliderIds = ['exposure','contrast','highlights','shadows','temp','tint','saturation','vibrance','clarity','vignette'];
sliderIds.forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    document.getElementById('val-'+id).textContent = el.value;
    renderImage();
  });
  el.addEventListener('change', saveState);
});

function renderImage() {
  if (!currentImage.src) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const v = {};
  sliderIds.forEach(id => v[id] = parseInt(document.getElementById(id).value));
  const brightness = 1 + v.exposure/100;
  const contrast = 1 + v.contrast/100;
  const saturate = 1 + v.saturation/100;
  const hueRot = v.tint * 1.2;
  ctx.filter = `brightness(${brightness}) contrast(${contrast}) saturate(${saturate}) hue-rotate(${hueRot}deg)`;
  ctx.drawImage(currentImage, 0, 0);
  ctx.filter = 'none';
  if (v.temp !== 0) {
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = v.temp > 0 ? `rgba(255,170,80,${Math.abs(v.temp)/400})` : `rgba(80,160,255,${Math.abs(v.temp)/400})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalCompositeOperation = 'source-over';
  }
  if (v.vignette > 0) {
    const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.width/4, canvas.width/2, canvas.height/2, canvas.width/1.2);
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(1,`rgba(0,0,0,${v.vignette/150})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }
  drawTextOverlayOnCanvas(ctx, canvas);
}

function resetSliders() {
  sliderIds.forEach(id => {
    const el = document.getElementById(id);
    el.value = el.getAttribute('data-default') || 0;
    document.getElementById('val-'+id).textContent = el.value;
  });
  renderImage();
  saveState();
}

const presets = {
  golden: {exposure:20,contrast:15,highlights:-10,shadows:20,temp:40,tint:5,saturation:15,vibrance:20,clarity:10,vignette:15},
  moody: {exposure:-20,contrast:30,highlights:-30,shadows:-20,temp:-30,tint:-10,saturation:-10,vibrance:5,clarity:20,vignette:40},
  vintage: {exposure:5,contrast:-15,highlights:-20,shadows:15,temp:25,tint:15,saturation:-20,vibrance:0,clarity:-15,vignette:30},
  dream: {exposure:15,contrast:-25,highlights:30,shadows:10,temp:10,tint:20,saturation:-10,vibrance:15,clarity:-30,vignette:0}
};
function applyPreset(name) {
  const p = presets[name];
  if (!p) return;
  Object.keys(p).forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = p[id]; document.getElementById('val-'+id).textContent = p[id]; }
  });
  renderImage();
  saveState();
}

function saveDrift() {
  const sliders = {};
  sliderIds.forEach(id => sliders[id] = document.getElementById(id).value);
  const drift = { date: Date.now(), sliders, image: canvas.toDataURL('image/jpeg', 0.7) };
  const drifts = JSON.parse(localStorage.getItem('rivlum_drifts') || '[]');
  drifts.push(drift);
  localStorage.setItem('rivlum_drifts', JSON.stringify(drifts));
  alert('🧡 Drift Saved!');
}

// UNDO/REDO
let historyStack = [], historyIndex = -1, isRestoring = false;
function getSlidersState() {
  const s = {};
  sliderIds.forEach(id => s[id] = document.getElementById(id).value);
  return s;
}
function saveState() {
  if (isRestoring) return;
  if (historyIndex < historyStack.length - 1) historyStack = historyStack.slice(0, historyIndex+1);
  historyStack.push(getSlidersState());
  if (historyStack.length > 20) historyStack.shift();
  historyIndex = historyStack.length - 1;
  updateUndoRedoUI();
}
function undoEdit() { if (historyIndex > 0) { historyIndex--; applyState(historyStack[historyIndex]); } }
function redoEdit() { if (historyIndex < historyStack.length - 1) { historyIndex++; applyState(historyStack[historyIndex]); } }
function applyState(state) {
  isRestoring = true;
  Object.keys(state).forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = state[id]; document.getElementById('val-'+id).textContent = state[id]; }
  });
  renderImage();
  isRestoring = false;
  updateUndoRedoUI();
}
function updateUndoRedoUI() {
  document.getElementById('undoBtn').disabled = historyIndex <= 0;
  document.getElementById('redoBtn').disabled = historyIndex >= historyStack.length - 1;
}
window.addEventListener('load', () => setTimeout(saveState, 500));

// TEXT OVERLAY
let overlayState = { text:'', size:40, position:'center', color:'#FFFFFF' };
function toggleTextPanel() {
  const b = document.getElementById('textPanelBody');
  b.style.display = b.style.display === 'none' ? 'block' : 'none';
}
document.getElementById('overlayText').addEventListener('input', e => { overlayState.text = e.target.value; renderImage(); });
document.getElementById('textSize').addEventListener('change', e => { overlayState.size = parseInt(e.target.value); renderImage(); });
document.getElementById('textPos').addEventListener('change', e => { overlayState.position = e.target.value; renderImage(); });
document.querySelectorAll('.colorChip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.colorChip').forEach(c => c.style.border = '2px solid transparent');
    chip.style.border = '2px solid #5B8266';
    overlayState.color = chip.getAttribute('data-color');
    renderImage();
  });
});
function clearOverlayText() { overlayState.text = ''; document.getElementById('overlayText').value = ''; renderImage(); }
function drawTextOverlayOnCanvas(ctx, canvas) {
  if (!overlayState.text) return;
  ctx.save();
  ctx.font = `bold ${overlayState.size}px 'Atkinson Hyperlegible', Helvetica, Arial, sans-serif`;
  ctx.fillStyle = overlayState.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.4)';
  ctx.shadowBlur = 8;
  let y;
  if (overlayState.position === 'top') y = overlayState.size + 20;
  else if (overlayState.position === 'bottom') y = canvas.height - overlayState.size;
  else y = canvas.height / 2;
  ctx.fillText(overlayState.text, canvas.width / 2, y);
  ctx.restore();
}

// EXPORT + SHARE
function exportWatermarkedImage() {
  const exp = document.createElement('canvas');
  const ec = exp.getContext('2d');
  exp.width = canvas.width; exp.height = canvas.height;
  ec.drawImage(canvas, 0, 0);
  const fs = Math.max(16, Math.round(exp.width * 0.035));
  const pad = Math.round(fs * 0.8);
  ec.save();
  ec.font = `bold ${fs}px 'Atkinson Hyperlegible', sans-serif`;
  const text = "✨ Made with RIVLUM";
  const tw = ec.measureText(text).width;
  const bw = tw + pad*2, bh = fs + pad;
  const bx = exp.width - bw - pad, by = exp.height - bh - pad;
  ec.fillStyle = "rgba(45,49,46,0.65)";
  ec.beginPath();
  if (ec.roundRect) ec.roundRect(bx,by,bw,bh,8); else ec.rect(bx,by,bw,bh);
  ec.fill();
  ec.fillStyle = "#fff"; ec.textBaseline = "middle";
  ec.fillText(text, bx + pad, by + bh/2);
  ec.restore();
  const link = document.createElement('a');
  link.download = `rivlum-edit-${Date.now()}.png`;
  link.href = exp.toDataURL('image/png');
  link.click();
}
async function shareEdit() {
  const data = { title:'RIVLUM', text:'Check out this photo I edited on RIVLUM! Try it:', url: window.location.origin };
  if (navigator.share) { try { await navigator.share(data); } catch(e){} }
  else window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(data.text + ' ' + data.url)}`, '_blank');
}

// AUTO-RESTORE FROM DRIFTS GALLERY
window.addEventListener('load', () => {
  const params = new URLSearchParams(window.location.search);
  if (params.get('restore') === '1') {
    const saved = JSON.parse(localStorage.getItem('rivlum_restore') || 'null');
    if (saved && saved.sliders) {
      Object.keys(saved.sliders).forEach(id => {
        const el = document.getElementById(id);
        if (el) { el.value = saved.sliders[id]; document.getElementById('val-'+id).textContent = saved.sliders[id]; }
      });
      if (saved.image) {
        currentImage.src = saved.image;
      } else {
        renderImage();
      }
      localStorage.removeItem('rivlum_restore');
    }
  }
});
</script>
</body>
</html>
