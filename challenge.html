<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge · RIVLUM</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Atkinson Hyperlegible', sans-serif; padding-bottom: 5rem; }

    .challenge-close {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      font-size: 1.2rem;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .challenge-close:active { transform: scale(0.95); }

    .challenge-header {
      text-align: center;
      padding: 3.5rem 1rem 1rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .challenge-header h2 {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: var(--accent);
      margin: 0 0 0.25rem;
    }
    .challenge-header .target-name {
      display: inline-block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.3rem 0.8rem;
      font-size: 0.85rem;
      color: var(--text);
      margin-top: 0.25rem;
    }

    .chip-row {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding: 0.75rem 1rem;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.82rem;
      cursor: pointer;
      font-family: 'Atkinson Hyperlegible', sans-serif;
    }
    .chip.active {
      border-color: var(--accent);
      background: var(--bg2);
      color: var(--accent);
      font-weight: 700;
    }

    .compare-row {
      display: flex;
      gap: 0.5rem;
      max-width: 500px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    .compare-tile {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .compare-tile canvas, .compare-tile img {
      display: block;
      width: 100%;
      height: auto;
    }
    .compare-label {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(45,49,46,0.75);
      color: white;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
    }

    .controls {
      max-width: 500px;
      margin: 0.75rem auto;
      padding: 0 1rem;
    }
    .control-group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    .control-group h4 {
      font-family: 'Caveat', cursive;
      font-size: 1.15rem;
      color: var(--accent);
      margin: 0 0 0.6rem;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-row label {
      width: 72px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
    }
    .slider-row .val {
      width: 32px;
      text-align: right;
      font-size: 0.78rem;
      color: var(--text);
      font-family: monospace;
    }
    .blend-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .blend-row label {
      width: 72px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .blend-row select {
      flex: 1;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.85rem;
    }

    .sticker-bar { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .sticker-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 1.2rem;
      cursor: pointer;
    }
    .sticker-btn:active { transform: scale(0.95); }

    .text-controls { display: flex; flex-direction: column; gap: 0.5rem; }
    .text-controls input {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
    }
    .color-dots { display: flex; gap: 0.4rem; }
    .color-dot {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
    }
    .color-dot.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

    .action-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      max-width: 500px;
      margin: 1rem auto;
      padding: 0 1rem;
    }
    .action-btn {
      flex: 1;
      min-width: 90px;
      padding: 0.7rem 0.4rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-size: 0.82rem;
      cursor: pointer;
      text-align: center;
    }
    .action-btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .action-btn.gold {
      background: var(--gold);
      color: var(--text);
      border-color: var(--gold);
    }
    .action-btn:active { transform: scale(0.97); }

    .drift-result {
      max-width: 500px;
      margin: 0.75rem auto;
      padding: 1rem 1.5rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-align: center;
      display: none;
    }
    .drift-result.show { display: block; }
    .drift-result .result-emoji {
      font-size: 2rem;
      display: block;
      margin-bottom: 0.3rem;
    }
    .drift-result .result-title {
      font-family: 'Caveat', cursive;
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }
    .drift-result .result-msg {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* ========== TOAST ========== */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      z-index: 500;
      max-width: 90%;
      text-align: center;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .streak-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--gold-bg);
      border: 1px solid var(--gold);
      color: var(--text);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.78rem;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>

      <h4>🎨 Color</h4>
      <div class="slider-row"><label>Temperature</label><input type="range" min="-100" max="100" value="0" data-key="temperature"><span class="val">0</span></div>
      <div class="slider-row"><label>Tint</label><input type="range" min="-100" max="100" value="0" data-key="tint"><span class="val">0</span></div>
      <div class="slider-row"><label>Saturation</label><input type="range" min="-100" max="100" value="0" data-key="saturation"><span class="val">0</span></div>
      <div class="slider-row"><label>Vibrance</label><input type="range" min="-100" max="100" value="0" data-key="vibrance"><span class="val">0</span></div>

      <div class="slider-row"><label>Vignette</label><input type="range" min="0" max="100" value="0" data-key="vignette"><span class="val">0</span></div>

        <button class="sticker-btn" data-sticker="🕶️">🕶️</button>
        <button class="sticker-btn" data-sticker="☁️">☁️</button>

        <button class="sticker-btn" data-sticker="🎨">🎨</button>

    <div class="control-group">

    <div class="control-group">

  <script>
    /* ========== GRAIN TEXTURE (shared) ========== */
    var grainCanvas = (function() {
      var c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      var cx = c.getContext('2d');
      var d = cx.createImageData(256, 256);
      for (var i = 0; i < d.data.length; i += 4) {
        var v = Math.random() * 255;
        d.data[i] = v; d.data[i+1] = v; d.data[i+2] = v; d.data[i+3] = 255;
      }
      cx.putImageData(d, 0, 0);
      return c;
    })();

    /* ========== CHALLENGES ========== */
    var CHALLENGES = {
      prism: {
        name: '☁️ Prism — Dreamy',
        hint: 'soft, pastel, floaty',
        img: 'https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80',
        target: { exposure: 30, contrast: -15, highlights: 40, shadows: 25, temperature: -10, tint: 15, saturation: -20, vibrance: 30, clarity: -30, vignette: 10, grain: 15 }
      },

        img: 'https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?auto=format&fit=crop&w=800&q=80',
        target: { exposure: 15, contrast: 25, highlights: -20, shadows: 20, temperature: 50, tint: -5, saturation: 25, vibrance: 35, clarity: 15, vignette: 25, grain: 10 }
      },
      mask: {
        name: '🌙 Mask — Moody',
        hint: 'dark, cinematic, dramatic',
        img: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80',
        target: { exposure: -20, contrast: 50, highlights: -40, shadows: 60, temperature: -25, tint: -10, saturation: -15, vibrance: 10, clarity: 40, vignette: 55, grain: 25 }
      },
      frame: {
        name: '⚡ Frame — Electric',
        hint: 'punchy, vibrant, bold',
        img: 'https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80',
        target: { exposure: 10, contrast: 55, highlights: 20, shadows: 30, temperature: 15, tint: 20, saturation: 60, vibrance: 50, clarity: 45, vignette: 20, grain: 5 }
      },
      grove: {
        name: '🌿 Grove — Nature',
        hint: 'earthy, lush, grounded',
        img: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80',
        target: { exposure: 5, contrast: 20, highlights: -10, shadows: 15, temperature: -5, tint: 25, saturation: 20, vibrance: 40, clarity: 25, vignette: 15, grain: 12 }
      },
      reel: {
        name: '📼 Reel — Vintage',
        hint: 'faded, nostalgic, 70s film',
        img: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80',
        target: { exposure: -5, contrast: -20, highlights: -25, shadows: -15, temperature: 25, tint: 10, saturation: -30, vibrance: -10, clarity: -15, vignette: 35, grain: 40 }
      }
    };

    var COMPLIMENTS = [
      '✨ saved! this one is beautiful',
      '🌿 oh wow, that\'s a mood',
      '💛 ur eye for light is unreal',
      '🌊 saved to your drifts — gorgeous',
      '🌅 the colors in this one... stunning',
      '✨ this one feels like a feeling',
      '🎨 saved! you\'re cooking',
      '🌙 effortlessly cinematic — nice',
      '⭐ saved, and it\'s a vibe',
      '🌸 soft, strong, perfect — saved'
    ];

    /* ========== STATE ========== */
    var currentChallenge = 'prism';
    var state = {
      exposure: 0, contrast: 0, highlights: 0, shadows: 0,
      temperature: 0, tint: 0, saturation: 0, vibrance: 0,
      clarity: 0, vignette: 0, grain: 0,
      blendMode: 'overlay', rotation: 0,
      stickers: [], textOverlay: '', textColor: '#FFFFFF'
    };
    var history = [];
    var historyIndex = -1;

    var userCanvas = document.getElementById('userCanvas');
    var userCtx = userCanvas.getContext('2d');
    var targetCanvas = document.getElementById('targetCanvas');
    var targetCtx = targetCanvas.getContext('2d');
    var baseImg = new Image();
    baseImg.crossOrigin = 'anonymous';

    /* ========== LOAD CHALLENGE ========== */
    function loadChallenge(key) {
      currentChallenge = key;
      var ch = CHALLENGES[key];
      document.getElementById('targetName').textContent = ch.name + ' — ' + ch.hint;
      document.querySelectorAll('.chip').forEach(function(c) {
        c.classList.toggle('active', c.getAttribute('data-key') === key);
      });

      baseImg.onload = function() {
        userCanvas.width = baseImg.naturalWidth;
        userCanvas.height = baseImg.naturalHeight;
        targetCanvas.width = baseImg.naturalWidth;
        targetCanvas.height = baseImg.naturalHeight;
        renderTarget();
        requestAnimationFrame(renderUser);
        setTimeout(renderUser, 50);
      };
      baseImg.onerror = function() {
        [userCtx, targetCtx].forEach(function(c) {
          c.canvas.width = 400; c.canvas.height = 300;
          c.fillStyle = '#EAE4DC';
          c.fillRect(0, 0, 400, 300);
          c.fillStyle = '#6E7570';
          c.font = '16px Atkinson Hyperlegible';
          c.textAlign = 'center';
          c.fillText('image could not load', 200, 150);
        });
      };
      baseImg.src = ch.img;
    }

    /* ========== RENDER (shared engine) ========== */
    function applyEdits(ctx, canvas, s) {
      if (!baseImg.complete || !baseImg.naturalWidth) return;
      var w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.save();

      if (s.rotation !== 0) {
        ctx.translate(w/2, h/2);
        ctx.rotate(s.rotation * Math.PI / 180);
        ctx.translate(-w/2, -h/2);
      }

      var brightness = 1 + (s.exposure / 100) * 0.5;
      var contrast = 1 + (s.contrast / 100) * 0.5;
      var saturate = 1 + (s.saturation / 100) * 0.8;
      var hueRotate = (s.temperature / 100) * 30;
      var blur = Math.abs(s.clarity) > 50 ? (Math.abs(s.clarity) - 50) / 100 : 0;
      var fs = 'brightness('+brightness+') contrast('+contrast+') saturate('+saturate+') hue-rotate('+hueRotate+'deg)';
      if (blur > 0) fs += ' blur('+blur+'px)';
      ctx.filter = fs;
      ctx.drawImage(baseImg, 0, 0, w, h);
      ctx.filter = 'none';

      if (Math.abs(s.tint) > 2) {
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = Math.abs(s.tint) / 100 * 0.3;
        ctx.fillStyle = s.tint > 0 ? '#ff66cc' : '#66ff99';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
      if (s.highlights > 5) {
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = s.highlights / 100 * 0.25;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
      if (s.shadows > 5) {
        ctx.globalCompositeOperation = 'multiply';
        ctx.globalAlpha = s.shadows / 100 * 0.3;
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
      if (Math.abs(s.vibrance) > 5) {
        ctx.globalCompositeOperation = 'saturation';
        ctx.globalAlpha = Math.abs(s.vibrance) / 100 * 0.3;
        ctx.fillStyle = s.vibrance > 0 ? '#808080' : '#404040';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      }
      if (s.vignette > 2) {
        var vA = s.vignette / 100 * 0.7;
        var g = ctx.createRadialGradient(w/2, h/2, w*0.25, w/2, h/2, w*0.75);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,'+vA+')');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      }
      if (s.grain > 2) {
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = (s.grain / 100) * 0.3;
        ctx.fillStyle = ctx.createPattern(grainCanvas, 'repeat');
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }

      ctx.restore();

      if (s.stickers && s.stickers.length) {
        var ss = Math.max(w, h) * 0.08;
        ctx.font = ss + 'px serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        s.stickers.forEach(function(st) {
          ctx.fillText(st.emoji, st.x * w, st.y * h);
        });
      }
      if (s.textOverlay) {
        var fsz = Math.max(w, h) * 0.05;
        ctx.font = 'bold '+fsz+'px Atkinson Hyperlegible, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillText(s.textOverlay, w/2 + 2, h - 30 + 2);
        ctx.fillStyle = s.textColor;
        ctx.fillText(s.textOverlay, w/2, h - 30);
      }
    }

    function renderTarget() {
      var t = CHALLENGES[currentChallenge].target;
      var targetState = Object.assign({}, t, { blendMode: 'overlay', rotation: 0, stickers: [], textOverlay: '', textColor: '#FFFFFF' });
      applyEdits(targetCtx, targetCanvas, targetState);
    }

    function renderUser() {
      applyEdits(userCtx, userCanvas, state);
    }

    /* ========== DRIFT ENGINE ========== */
    function checkDrift() {
      var t = CHALLENGES[currentChallenge].target;
      var keys = ['exposure','contrast','highlights','shadows','temperature','tint','saturation','vibrance','clarity','vignette','grain'];
      var totalDiff = 0;
      keys.forEach(function(k) {
        totalDiff += Math.abs((state[k] || 0) - (t[k] || 0));
      });
      var avgDiff = totalDiff / keys.length / 100;
      var result = document.getElementById('driftResult');
      result.classList.add('show');

      if (avgDiff < 0.25) {
        document.getElementById('resultEmoji').textContent = '⭐';
        document.getElementById('resultTitle').textContent = 'Star Unlocked!';
        document.getElementById('resultMsg').textContent = 'you nailed it — this edit perfectly matches the vibe. constellation updated 🌌';
        var stars = JSON.parse(localStorage.getItem('rivlum_stars') || '[]');
        if (stars.indexOf(currentChallenge) === -1) {
          stars.push(currentChallenge);
          localStorage.setItem('rivlum_stars', JSON.stringify(stars));
        }
      } else if (avgDiff > 1.2) {
        document.getElementById('resultEmoji').textContent = '🌊';
        document.getElementById('resultTitle').textContent = 'Creative Drift Discovered';
        document.getElementById('resultMsg').textContent = 'you went your own way — and honestly? that\'s what RIVLUM is for. save it to your drifts';
      } else {
        document.getElementById('resultEmoji').textContent = '✨';
        document.getElementById('resultTitle').textContent = 'Getting Closer!';
        document.getElementById('resultMsg').textContent = 'you\'re in the right neighborhood — tweak a bit more and you\'ll match it';
      }
    }

    /* ========== TOAST ========== */
    var toast = document.getElementById('toast');
    var toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        toast.classList.remove('show');
      }, 2500);
    }

    /* ========== DRIFT CHAIN ========== */
    function updateStreak() {
      var today = new Date().toDateString();
      var last = localStorage.getItem('rivlum_last_edit');
      var streak = parseInt(localStorage.getItem('rivlum_streak') || '0');
      if (last === today) {
        // same day, no change
      } else {
        var yesterday = new Date(Date.now() - 86400000).toDateString();
        if (last === yesterday) {
          streak += 1;
        } else {
          streak = 1;
        }
        localStorage.setItem('rivlum_streak', streak);
        localStorage.setItem('rivlum_last_edit', today);
      }
      renderStreak();
    }
    function renderStreak() {
      var streak = parseInt(localStorage.getItem('rivlum_streak') || '0');
      var wrap = document.getElementById('streakWrap');
      if (streak > 0) {
        wrap.innerHTML = '<div class="streak-pill">🔥 ' + streak + '-day drift chain</div>';
      } else {
        wrap.innerHTML = '';
      }
    }
    renderStreak();

    /* ========== SAVE DRIFT ========== */
    function saveDrift() {
      try {
        var drifts = JSON.parse(localStorage.getItem('rivlum_drifts') || '[]');
        drifts.unshift({
          date: new Date().toISOString(),
          challenge: currentChallenge,
          sliders: {
            exposure: state.exposure, contrast: state.contrast,
            highlights: state.highlights, shadows: state.shadows,
            temperature: state.temperature, tint: state.tint,
            saturation: state.saturation, vibrance: state.vibrance,
            clarity: state.clarity, vignette: state.vignette, grain: state.grain
          },
          blendMode: state.blendMode,
          rotation: state.rotation,
          stickers: state.stickers,
          textOverlay: state.textOverlay,
          textColor: state.textColor,
          image: userCanvas.toDataURL('image/jpeg', 0.7)
        });
        if (drifts.length > 30) drifts = drifts.slice(0, 30);
        localStorage.setItem('rivlum_drifts', JSON.stringify(drifts));
        if (!localStorage.getItem('rivlum_born')) {
          localStorage.setItem('rivlum_born', Date.now());
        }
        updateStreak();
        var msg = COMPLIMENTS[Math.floor(Math.random() * COMPLIMENTS.length)];
        showToast(msg);
      } catch(e) {
        showToast('💛 saved! (storage almost full tho)');
      }
    }

    /* ========== HISTORY ========== */
    function pushHistory() {
      var snap = JSON.parse(JSON.stringify(state));
      if (historyIndex < history.length - 1) history = history.slice(0, historyIndex + 1);
      history.push(snap);
      if (history.length > 20) history.shift();
      historyIndex = history.length - 1;
    }
    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        state = JSON.parse(JSON.stringify(history[historyIndex]));
        syncUIFromState();
        renderUser();
      }
    }

    /* ========== UI SYNC ========== */
    function syncUIFromState() {
      document.querySelectorAll('input[type="range"]').forEach(function(sl) {
        var k = sl.getAttribute('data-key');
        if (state.hasOwnProperty(k)) {
          sl.value = state[k];
          var v = sl.parentElement.querySelector('.val');
          if (v) v.textContent = k === 'rotation' ? state[k] + '°' : state[k];
        }
      });
      document.getElementById('blendMode').value = state.blendMode;
      document.getElementById('textInput').value = state.textOverlay;
      document.querySelectorAll('.color-dot').forEach(function(d) {
        d.classList.toggle('active', d.getAttribute('data-color') === state.textColor);
      });
    }
    function readUI() {
      document.querySelectorAll('input[type="range"]').forEach(function(sl) {
        var k = sl.getAttribute('data-key');
        if (state.hasOwnProperty(k)) state[k] = parseInt(sl.value);
      });
      state.blendMode = document.getElementById('blendMode').value;
      state.textOverlay = document.getElementById('textInput').value;
    }

    /* ========== EVENTS ========== */
    document.querySelectorAll('.chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        loadChallenge(this.getAttribute('data-key'));
        document.getElementById('driftResult').classList.remove('show');
      });
    });

    document.querySelectorAll('input[type="range"]').forEach(function(sl) {
      sl.addEventListener('input', function() {
        var k = this.getAttribute('data-key');
        var v = this.parentElement.querySelector('.val');
        if (v) v.textContent = k === 'rotation' ? this.value + '°' : this.value;
        readUI();
        renderUser();
      });
      sl.addEventListener('change', pushHistory);
    });

    document.getElementById('blendMode').addEventListener('change', function() {
      readUI(); renderUser(); pushHistory();
    });
    document.getElementById('textInput').addEventListener('input', function() {
      readUI(); renderUser();
    });
    document.getElementById('textInput').addEventListener('change', pushHistory);

    document.querySelectorAll('.color-dot').forEach(function(d) {
      d.addEventListener('click', function() {
        document.querySelectorAll('.color-dot').forEach(function(x) { x.classList.remove('active'); });
        this.classList.add('active');
        state.textColor = this.getAttribute('data-color');
        renderUser();
        pushHistory();
      });
    });

    document.querySelectorAll('.sticker-btn').forEach(function(b) {
      b.addEventListener('click', function() {
        state.stickers.push({
          emoji: this.getAttribute('data-sticker'),
          x: 0.3 + Math.random() * 0.4,
          y: 0.3 + Math.random() * 0.4
        });
        renderUser();
        pushHistory();
      });
    });

    userCanvas.addEventListener('click', function(e) {
      if (!state.stickers.length) return;
      var r = userCanvas.getBoundingClientRect();
      var x = (e.clientX - r.left) / r.width;
      var y = (e.clientY - r.top) / r.height;
      state.stickers[state.stickers.length - 1].x = x;
      state.stickers[state.stickers.length - 1].y = y;
      renderUser();
    });

    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('checkBtn').addEventListener('click', checkDrift);
    document.getElementById('saveBtn').addEventListener('click', saveDrift);

    document.getElementById('exportBtn').addEventListener('click', function() {
      var ec = document.createElement('canvas');
      ec.width = userCanvas.width; ec.height = userCanvas.height;
      var ex = ec.getContext('2d');
      ex.drawImage(userCanvas, 0, 0);
      var w = ec.width, h = ec.height;
      var pH = Math.max(28, h * 0.04);
      var pP = pH * 0.5;
      ex.font = 'bold ' + (pH * 0.55) + 'px Atkinson Hyperlegible, sans-serif';
      var tw = ex.measureText('✨ Made with RIVLUM').width;
      var pW = tw + pP * 2;
      var px = w - pW - pP, py = h - pH - pP;
      ex.save();
      ex.globalAlpha = 0.6;
      if (ex.roundRect) {
        ex.beginPath(); ex.roundRect(px, py, pW, pH, pH / 2);
        ex.fillStyle = '#2D312E'; ex.fill();
      } else {
        ex.fillStyle = '#2D312E'; ex.fillRect(px, py, pW, pH);
      }
      ex.globalAlpha = 0.9;
      ex.fillStyle = '#FFFFFF';
      ex.textAlign = 'left'; ex.textBaseline = 'middle';
      ex.fillText('✨ Made with RIVLUM', px + pP, py + pH / 2);
      ex.restore();
      var link = document.createElement('a');
      link.download = 'rivlum-' + currentChallenge + '.png';
      link.href = ec.toDataURL('image/png');
      link.click();
      showToast('⬇️ exported — looks amazing');
    });

    /* ========== INIT ========== */
    var params = new URLSearchParams(window.location.search);
    var startKey = params.get('c') || 'prism';
    if (!CHALLENGES[startKey]) startKey = 'prism';
    loadChallenge(startKey);
    pushHistory();
  </script>

</body>
</html>
