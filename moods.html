<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Moods · RIVLUM</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Atkinson Hyperlegible', sans-serif; padding-bottom: 7rem; }

    .moods-close {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      font-size: 1.2rem;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .moods-close:active { transform: scale(0.95); }

    .moods-hero {
      text-align: center;
      padding: 3.5rem 1.5rem 1.5rem;
      background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
    }
    .moods-hero h2 {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: var(--accent);
      margin: 0 0 0.25rem;
    }
    .moods-hero p {
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .today-banner {
      max-width: 500px;
      margin: 1rem auto 0;
      padding: 0.85rem 1.25rem;
      background: var(--card);
      border: 2px solid var(--gold);
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .today-banner .today-emoji {
      font-size: 2rem;
      flex-shrink: 0;
    }
    .today-banner .today-info {
      flex: 1;
    }
    .today-banner .today-label {
      font-size: 0.72rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .today-banner .today-name {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: var(--text);
    }
    .today-banner .today-btn {
      padding: 0.45rem 0.85rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 999px;
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
    }
    .today-banner .today-btn:active { transform: scale(0.97); }

    .moods-grid {
      max-width: 680px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 1rem;
    }

    .mood-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px var(--shadow);
      transition: transform 0.15s;
      position: relative;
    }
    .mood-card:hover { transform: translateY(-2px); }
    .mood-card.is-today {
      border-color: var(--gold);
      box-shadow: 0 2px 16px rgba(242,201,76,0.15);
    }
    .mood-card.is-today::before {
      content: '⭐ today\'s mood';
      position: absolute;
      top: 10px;
      right: 10px;
      background: var(--gold);
      color: var(--text);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      z-index: 5;
    }

    .mood-swatch {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      position: relative;
    }
    .mood-swatch::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 20px;
      background: linear-gradient(transparent, var(--card));
    }

    .mood-body {
      padding: 0.85rem 1rem 1rem;
    }
    .mood-body h3 {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: var(--text);
      margin: 0 0 0.15rem;
    }
    .mood-body .mood-vibe {
      font-size: 0.8rem;
      color: var(--muted);
      margin: 0 0 0.65rem;
      font-style: italic;
    }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.35rem;
      margin-bottom: 0.65rem;
    }
    .recipe-item {
      background: var(--bg2);
      border-radius: 6px;
      padding: 0.3rem 0.4rem;
      text-align: center;
    }
    .recipe-item .recipe-label {
      font-size: 0.62rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: block;
    }
    .recipe-item .recipe-val {
      font-size: 0.78rem;
      color: var(--text);
      font-family: monospace;
      font-weight: 700;
    }
    .recipe-val.pos { color: var(--accent); }
    .recipe-val.neg { color: #D07251; }
    .recipe-val.zero { color: var(--muted); }

    .mood-apply-btn {
      width: 100%;
      padding: 0.55rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .mood-apply-btn:hover {
      border-color: var(--accent);
      background: var(--bg2);
    }
    .mood-apply-btn:active { transform: scale(0.98); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      z-index: 500;
      max-width: 90%;
      text-align: center;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .moods-footer-spacer { height: 2rem; }

    @media (max-width: 400px) {
      .moods-grid {
        grid-template-columns: 1fr;
      }
      .recipe-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <script>
    (function(){
      var t = localStorage.getItem('rivlum_theme') || 'meadow';
      document.body.setAttribute('data-theme', t);
      if (localStorage.getItem('rivlum_dys') === '1') document.body.classList.add('dyslexia-font');
      if (localStorage.getItem('rivlum_motion') === '1') document.body.classList.add('reduced-motion');
    })();
  </script>

  <a href="index.html" class="moods-close" aria-label="Go home">✕</a>

  <section class="moods-hero">
    <h2>color moods 🎨</h2>
    <p>each mood is a recipe — a specific combination of sliders that creates a feeling. tap "apply" to load one into the free editor and make it yours.</p>
  </section>

  <div id="todayBanner"></div>

  <div class="moods-grid" id="moodsGrid"></div>

  <div class="moods-footer-spacer"></div>

  <footer class="pretty-footer">
    <span class="footer-emoji">🌿</span>
    <span class="footer-script">every color tells a feeling</span>
    <span class="footer-copy">© 2026 RIVLUM · <a href="privacy.html">Privacy Oath</a></span>
  </footer>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="challenge.html" class="nav-item"><span class="nav-icon">✨</span><span class="nav-label">Edit</span></a>
    <a href="free-edit.html" class="nav-item"><span class="nav-icon">📸</span><span class="nav-label">Free</span></a>
    <a href="room.html" class="nav-item"><span class="nav-icon">⚡</span><span class="nav-label">Room</span></a>
    <a href="constellation.html" class="nav-item"><span class="nav-icon">🌌</span><span class="nav-label">Sky</span></a>
    <a href="about.html" class="nav-item"><span class="nav-icon">💛</span><span class="nav-label">About</span></a>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    /* ========== MOOD DATA ========== */
    var MOODS = [
      {
        key: 'golden',
        name: 'Golden Hour',
        emoji: '🌅',
        color: '#F2C94C',
        gradient: 'linear-gradient(135deg, #F2C94C 0%, #D07251 100%)',
        vibe: 'warm, glowing, honey light spilling everywhere',
        sliders: { exposure: 15, contrast: 20, highlights: -10, shadows: 15, temperature: 45, tint: -5, saturation: 20, vibrance: 30, clarity: 10, vignette: 20, grain: 8 }
      },
      {
        key: 'midnight',
        name: 'Midnight Blue',
        emoji: '🌙',
        color: '#6C8EA4',
        gradient: 'linear-gradient(135deg, #1a1a2e 0%, #6C8EA4 100%)',
        vibe: 'cool, quiet, the world after everyone sleeps',
        sliders: { exposure: -15, contrast: 35, highlights: -30, shadows: 40, temperature: -35, tint: -15, saturation: -10, vibrance: 5, clarity: 30, vignette: 45, grain: 20 }
      },
      {
        key: 'dream',
        name: 'Dreamscape',
        emoji: '☁️',
        color: '#C4A8D4',
        gradient: 'linear-gradient(135deg, #C4A8D4 0%, #E8D5F0 100%)',
        vibe: 'soft, floaty, like remembering a dream in pastel',
        sliders: { exposure: 25, contrast: -20, highlights: 35, shadows: 20, temperature: -5, tint: 20, saturation: -15, vibrance: 25, clarity: -25, vignette: 10, grain: 12 }
      },
      {
        key: 'storm',
        name: 'Storm',
        emoji: '⛈️',
        color: '#5A6672',
        gradient: 'linear-gradient(135deg, #2C3E50 0%, #5A6672 100%)',
        vibe: 'heavy, dramatic, the sky right before it breaks',
        sliders: { exposure: -25, contrast: 45, highlights: -35, shadows: 55, temperature: -20, tint: -5, saturation: -25, vibrance: -10, clarity: 40, vignette: 50, grain: 30 }
      },
      {
        key: 'electric',
        name: 'Electric',
        emoji: '⚡',
        color: '#E86B6B',
        gradient: 'linear-gradient(135deg, #E86B6B 0%, #F2C94C 100%)',
        vibe: 'punchy, loud, neon signs and city rain',
        sliders: { exposure: 10, contrast: 50, highlights: 15, shadows: 25, temperature: 10, tint: 25, saturation: 55, vibrance: 45, clarity: 40, vignette: 15, grain: 5 }
      },
      {
        key: 'nostalgia',
        name: 'Nostalgia',
        emoji: '📼',
        color: '#C4956A',
        gradient: 'linear-gradient(135deg, #C4956A 0%, #8B6F4E 100%)',
        vibe: 'faded, warm, your parents\' old photo album',
        sliders: { exposure: -5, contrast: -15, highlights: -20, shadows: -10, temperature: 30, tint: 8, saturation: -25, vibrance: -5, clarity: -10, vignette: 30, grain: 35 }
      },
      {
        key: 'meadow',
        name: 'Spring Meadow',
        emoji: '🌿',
        color: '#5B8266',
        gradient: 'linear-gradient(135deg, #5B8266 0%, #A8D5A2 100%)',
        vibe: 'fresh, alive, morning dew on green grass',
        sliders: { exposure: 10, contrast: 15, highlights: 5, shadows: 10, temperature: -8, tint: 20, saturation: 25, vibrance: 35, clarity: 20, vignette: 10, grain: 8 }
      }
    ];

    var SLIDER_SHORT = {
      exposure: 'Exp', contrast: 'Con', highlights: 'Hi', shadows: 'Sh',
      temperature: 'Temp', tint: 'Tint', saturation: 'Sat', vibrance: 'Vib',
      clarity: 'Clr', vignette: 'Vig', grain: 'Grn'
    };

    /* ========== DAILY MOOD ========== */
    function getDailyMoodIndex() {
      var d = new Date();
      var dayOfYear = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
      return dayOfYear % MOODS.length;
    }
    var todayIdx = getDailyMoodIndex();
    var todayMood = MOODS[todayIdx];

    /* ========== TOAST ========== */
    var toast = document.getElementById('toast');
    var toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    /* ========== TODAY BANNER ========== */
    function renderTodayBanner() {
      var wrap = document.getElementById('todayBanner');
      wrap.innerHTML =
        '<div class="today-banner">' +
          '<span class="today-emoji">' + todayMood.emoji + '</span>' +
          '<div class="today-info">' +
            '<span class="today-label">today\'s procedural mood</span>' +
            '<span class="today-name">' + todayMood.name + '</span>' +
          '</div>' +
          '<a href="free-edit.html" class="today-btn" id="todayApplyBtn">Apply →</a>' +
        '</div>';

      document.getElementById('todayApplyBtn').addEventListener('click', function(e) {
        e.preventDefault();
        applyMoodToFreeEdit(todayMood);
      });
    }
    renderTodayBanner();

    /* ========== RENDER MOOD CARDS ========== */
    function renderMoods() {
      var grid = document.getElementById('moodsGrid');
      var html = '';

      MOODS.forEach(function(mood, idx) {
        var isToday = idx === todayIdx;
        var recipeHtml = '';
        var keys = ['exposure','contrast','highlights','shadows','temperature','tint','saturation','vibrance','clarity','vignette','grain'];

        keys.forEach(function(k) {
          var v = mood.sliders[k];
          var cls = v > 0 ? 'pos' : (v < 0 ? 'neg' : 'zero');
          var sign = v > 0 ? '+' : '';
          recipeHtml +=
            '<div class="recipe-item">' +
              '<span class="recipe-label">' + SLIDER_SHORT[k] + '</span>' +
              '<span class="recipe-val ' + cls + '">' + sign + v + '</span>' +
            '</div>';
        });

        html +=
          '<div class="mood-card' + (isToday ? ' is-today' : '') + '">' +
            '<div class="mood-swatch" style="background:' + mood.gradient + '">' +
              mood.emoji +
            '</div>' +
            '<div class="mood-body">' +
              '<h3>' + mood.emoji + ' ' + mood.name + '</h3>' +
              '<p class="mood-vibe">"' + mood.vibe + '"</p>' +
              '<div class="recipe-grid">' + recipeHtml + '</div>' +
              '<button class="mood-apply-btn" data-mood-idx="' + idx + '">✨ Apply to Free Edit</button>' +
            '</div>' +
          '</div>';
      });

      grid.innerHTML = html;

      grid.querySelectorAll('.mood-apply-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(this.getAttribute('data-mood-idx'));
          applyMoodToFreeEdit(MOODS[idx]);
        });
      });
    }
    renderMoods();

    /* ========== APPLY MOOD ========== */
    function applyMoodToFreeEdit(mood) {
      var restoreData = {
        challenge: 'mood-' + mood.key,
        sliders: Object.assign({}, mood.sliders),
        blendMode: 'overlay',
        rotation: 0,
        stickers: [],
        textOverlay: '',
        textColor: '#FFFFFF'
      };
      localStorage.setItem('rivlum_restore', JSON.stringify(restoreData));
      showToast(mood.emoji + ' ' + mood.name + ' loaded — go create!');
      setTimeout(function() {
        window.location.href = 'free-edit.html?restore=1';
      }, 600);
    }
  </script>

</body>
</html>
