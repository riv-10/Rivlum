<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Co-Edit Room · RIVLUM</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Atkinson Hyperlegible', sans-serif; padding-bottom: 5rem; }

    .room-close-btn {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      font-size: 1.2rem;
      box-shadow: 0 2px 10px var(--shadow);
      transition: transform 0.15s, background 0.15s;
    }
    .room-close-btn:hover { background: var(--bg2); transform: scale(1.08); }
    .room-close-btn:active { transform: scale(0.95); }

    .room-header {
      text-align: center;
      padding: 3.5rem 1rem 1rem;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
    }
    .room-header h2 {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: var(--accent);
      margin: 0 0 0.25rem;
    }
    .room-header p {
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0;
    }
    .room-code {
      display: inline-block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.3rem 0.75rem;
      font-family: monospace;
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 0.5rem;
      word-break: break-all;
      max-width: 90%;
    }

    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 500px;
      margin: 1rem auto;
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px var(--shadow);
    }
    .canvas-wrap canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    .controls {
      max-width: 500px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    .control-group {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      box-shadow: 0 1px 6px var(--shadow);
    }
    .control-group h4 {
      font-family: 'Caveat', cursive;
      font-size: 1.15rem;
      color: var(--accent);
      margin: 0 0 0.6rem;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-row label {
      width: 72px;
      font-size: 0.82rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
    }
    .slider-row .val {
      width: 32px;
      text-align: right;
      font-size: 0.78rem;
      color: var(--text);
      font-family: monospace;
    }
    .blend-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .blend-row label {
      width: 72px;
      font-size: 0.82rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .blend-row select {
      flex: 1;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.85rem;
    }

    .sticker-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .sticker-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, transform 0.1s;
    }
    .sticker-btn:hover { border-color: var(--accent); transform: scale(1.1); }
    .sticker-btn:active { transform: scale(0.95); }

    .text-controls {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .text-controls input[type="text"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.9rem;
    }
    .color-dots {
      display: flex;
      gap: 0.4rem;
    }
    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--border);
      cursor: pointer;
      transition: transform 0.1s;
    }
    .color-dot:hover { transform: scale(1.15); }
    .color-dot.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

    .action-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      max-width: 500px;
      margin: 1rem auto;
      padding: 0 1rem;
    }
    .action-btn {
      flex: 1;
      min-width: 100px;
      padding: 0.7rem 0.5rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s, transform 0.1s;
    }
    .action-btn:hover { background: var(--bg2); }
    .action-btn:active { transform: scale(0.97); }
    .action-btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .action-btn.primary:hover { opacity: 0.9; }

    .upload-area {
      max-width: 500px;
      margin: 0.75rem auto;
      padding: 0 1rem;
    }
    .upload-btn {
      width: 100%;
      padding: 0.65rem;
      border: 2px dashed var(--border);
      border-radius: 10px;
      background: var(--bg2);
      color: var(--muted);
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.88rem;
      cursor: pointer;
      text-align: center;
      transition: border-color 0.15s;
    }
    .upload-btn:hover { border-color: var(--accent); }
    .upload-btn input { display: none; }

    .turn-indicator {
      text-align: center;
      padding: 0.5rem;
      font-size: 0.85rem;
      color: var(--gold);
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <script>
    (function(){
      var t = localStorage.getItem('rivlum_theme') || 'meadow';
      document.body.setAttribute('data-theme', t);
      if (localStorage.getItem('rivlum_dys') === '1') document.body.classList.add('dyslexia-font');
      if (localStorage.getItem('rivlum_motion') === '1') document.body.classList.add('reduced-motion');
    })();
  </script>

  <!-- Close Button -->
  <a href="index.html" class="room-close-btn" aria-label="Leave room and go home">✕</a>

  <!-- Header -->
  <header class="room-header">
    <h2>co-edit room ⚡</h2>
    <p>share the link below — your friend edits the same photo!</p>
    <div class="room-code" id="roomCode">generating...</div>
  </header>

  <p class="turn-indicator" id="turnIndicator">✨ your turn to edit!</p>

  <!-- Canvas -->
  <div class="canvas-wrap">
    <canvas id="mainCanvas" width="800" height="600"></canvas>
  </div>

  <!-- Upload -->
  <div class="upload-area">
    <label class="upload-btn">
      📸 upload a different photo
      <input type="file" id="fileInput" accept="image/*">
    </label>
  </div>

  <!-- Controls -->
  <div class="controls">

    <!-- Light -->
    <div class="control-group">
      <h4>☀️ Light</h4>
      <div class="slider-row">
        <label>Exposure</label>
        <input type="range" min="-100" max="100" value="0" data-key="exposure">
        <span class="val">0</span>
      </div>
      <div class="slider-row">
        <label>Contrast</label>
        <input type="range" min="-100" max="100" value="0" data-key="contrast">
        <span class="val">0</span>
      </div>
      <div class="slider-row">
        <label>Highlights</label>
        <input type="range" min="-100" max="100" value="0" data-key="highlights">
        <span class="val">0</span>
      </div>
      <div class="slider-row">
        <label>Shadows</label>
        <input type="range" min="-100" max="100" value="0" data-key="shadows">
        <span class="val">0</span>
      </div>
    </div>

    <!-- Color -->
    <div class="control-group">
      <h4>🎨 Color</h4>
      <div class="slider-row">
        <label>Temperature</label>
        <input type="range" min="-100" max="100" value="0" data-key="temperature">
        <span class="val">0</span>
      </div>
      <div class="slider-row">
        <label>Tint</label>
        <input type="range" min="-100" max="100" value="0" data-key="tint">
        <span class="val">0</span>
      </div>
      <div class="slider-row">
        <label>Saturation</label>
        <input type="range" min="-100" max="100" value="0" data-key="saturation">
        <span class="val">0</span>
      </div>
      <div class="slider-row">
        <label>Vibrance</label>
        <input type="range" min="-100" max="100" value="0" data-key="vibrance">
        <span class="val">0</span>
      </div>
      <div class="blend-row">
        <label>Blend</label>
        <select id="blendMode">
          <option value="normal">Normal</option>
          <option value="overlay" selected>Overlay</option>
          <option value="multiply">Multiply</option>
          <option value="screen">Screen</option>
        </select>
      </div>
    </div>

    <!-- Texture -->
    <div class="control-group">
      <h4>🧶 Texture</h4>
      <div class="slider-row">
        <label>Clarity</label>
        <input type="range" min="-100" max="100" value="0" data-key="clarity">
        <span class="val">0</span>
      </div>
      <div class="slider-row">
        <label>Vignette</label>
        <input type="range" min="0" max="100" value="0" data-key="vignette">
        <span class="val">0</span>
      </div>
      <div class="slider-row">
        <label>Grain</label>
        <input type="range" min="0" max="100" value="0" data-key="grain">
        <span class="val">0</span>
      </div>
    </div>

    <!-- Stickers -->
    <div class="control-group">
      <h4>✨ Stickers</h4>
      <div class="sticker-bar">
        <button class="sticker-btn" data-sticker="⭐">⭐</button>
        <button class="sticker-btn" data-sticker="🌅">🌅</button>
        <button class="sticker-btn" data-sticker="🌿">🌿</button>
        <button class="sticker-btn" data-sticker="⚡">⚡</button>
        <button class="sticker-btn" data-sticker="🕶️">🕶️</button>
        <button class="sticker-btn" data-sticker="☁️">☁️</button>
        <button class="sticker-btn" data-sticker="🔥">🔥</button>
        <button class="sticker-btn" data-sticker="🎨">🎨</button>
      </div>
    </div>

    <!-- Text -->
    <div class="control-group">
      <h4>💬 Text Overlay</h4>
      <div class="text-controls">
        <input type="text" id="textInput" placeholder="type something pretty..." maxlength="40">
        <div class="color-dots">
          <span class="color-dot active" data-color="#FFFFFF" style="background:#FFFFFF;"></span>
          <span class="color-dot" data-color="#2D312E" style="background:#2D312E;"></span>
          <span class="color-dot" data-color="#F2C94C" style="background:#F2C94C;"></span>
          <span class="color-dot" data-color="#5B8266" style="background:#5B8266;"></span>
          <span class="color-dot" data-color="#D07251" style="background:#D07251;"></span>
        </div>
      </div>
    </div>

    <!-- Rotation -->
    <div class="control-group">
      <h4>🔄 Rotation</h4>
      <div class="slider-row">
        <label>Angle</label>
        <input type="range" min="-180" max="180" value="0" data-key="rotation">
        <span class="val">0°</span>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="action-bar">
    <button class="action-btn" id="undoBtn">↩️ Undo</button>
    <button class="action-btn" id="redoBtn">↪️ Redo</button>
    <button class="action-btn" id="copyLinkBtn">🔗 Copy Link</button>
    <button class="action-btn primary" id="exportBtn">💾 Export</button>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav" aria-label="Main navigation">

  <script>
    /* ========== GRAIN TEXTURE ========== */
    var grainCanvas = (function() {
      var c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      var ctx = c.getContext('2d');
      var imgData = ctx.createImageData(256, 256);
      var d = imgData.data;
      for (var i = 0; i < d.length; i += 4) {
        var v = Math.random() * 255;
        d[i] = v;
        d[i+1] = v;
        d[i+2] = v;
        d[i+3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      return c;
    })();

    /* ========== STATE ========== */
    var canvas = document.getElementById('mainCanvas');
    var ctx = canvas.getContext('2d');
    var baseImg = new Image();
    baseImg.crossOrigin = 'anonymous';
    var defaultImg = 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80';

    var state = {
      exposure: 0, contrast: 0, highlights: 0, shadows: 0,
      temperature: 0, tint: 0, saturation: 0, vibrance: 0,
      clarity: 0, vignette: 0, grain: 0,
      blendMode: 'overlay',
      rotation: 0,
      stickers: [],
      textOverlay: '',
      textColor: '#FFFFFF'
    };

    var history = [];
    var historyIndex = -1;
    var MAX_HISTORY = 20;

    /* ========== INIT ========== */
    function init() {
      var hash = window.location.hash;
      if (hash && hash.length > 1) {
        try {
          var decoded = JSON.parse(atob(hash.substring(1)));
          if (decoded.sliders) {
            Object.keys(decoded.sliders).forEach(function(k) {
              if (state.hasOwnProperty(k)) state[k] = decoded.sliders[k];
            });
          }
          if (decoded.blendMode) state.blendMode = decoded.blendMode;
          if (decoded.rotation !== undefined) state.rotation = decoded.rotation;
          if (decoded.stickers) state.stickers = decoded.stickers;
          if (decoded.textOverlay) state.textOverlay = decoded.textOverlay;
          if (decoded.textColor) state.textColor = decoded.textColor;
          if (decoded.image) {
            defaultImg = decoded.image;
          }
          syncUIFromState();
        } catch(e) {
          console.log('could not parse room hash, starting fresh');
        }
      }
      updateRoomCode();
      loadImage(defaultImg);
    }

    function loadImage(src) {
      baseImg.onload = function() {
        canvas.width = baseImg.naturalWidth;
        canvas.height = baseImg.naturalHeight;
        pushHistory();
        renderCanvas();
      };
      baseImg.onerror = function() {
        canvas.width = 800;
        canvas.height = 600;
        ctx.fillStyle = '#EAE4DC';
        ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = '#6E7570';
        ctx.font = '20px Atkinson Hyperlegible';
        ctx.textAlign = 'center';
        ctx.fillText('image could not load :(', 400, 300);
      };
      baseImg.src = src;
    }

    /* ========== RENDER ========== */
    function renderCanvas() {
      if (!baseImg.complete || !baseImg.naturalWidth) return;
      var w = canvas.width;
      var h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.save();

      /* Rotation */
      if (state.rotation !== 0) {
        ctx.translate(w / 2, h / 2);
        ctx.rotate(state.rotation * Math.PI / 180);
        ctx.translate(-w / 2, -h / 2);
      }

      /* Build CSS filter string */
      var brightness = 1 + (state.exposure / 100) * 0.5;
      var contrast = 1 + (state.contrast / 100) * 0.5;
      var saturate = 1 + (state.saturation / 100) * 0.8;
      var hueRotate = (state.temperature / 100) * 30;
      var blur = Math.abs(state.clarity) > 50 ? (Math.abs(state.clarity) - 50) / 100 : 0;

      var filterStr = 'brightness(' + brightness + ') contrast(' + contrast + ') saturate(' + saturate + ') hue-rotate(' + hueRotate + 'deg)';
      if (blur > 0) filterStr += ' blur(' + blur + 'px)';
      ctx.filter = filterStr;

      ctx.drawImage(baseImg, 0, 0, w, h);
      ctx.filter = 'none';

      /* Tint overlay */
      if (Math.abs(state.tint) > 2) {
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = Math.abs(state.tint) / 100 * 0.3;
        ctx.fillStyle = state.tint > 0 ? '#ff66cc' : '#66ff99';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }

      /* Highlights / Shadows via overlay rectangles */
      if (state.highlights > 5) {
        ctx.globalCompositeOperation = 'screen';
        ctx.globalAlpha = state.highlights / 100 * 0.25;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }
      if (state.shadows > 5) {
        ctx.globalCompositeOperation = 'multiply';
        ctx.globalAlpha = state.shadows / 100 * 0.3;
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }

      /* Vibrance (selective saturation boost via color overlay) */
      if (Math.abs(state.vibrance) > 5) {
        ctx.globalCompositeOperation = 'saturation';
        ctx.globalAlpha = Math.abs(state.vibrance) / 100 * 0.3;
        ctx.fillStyle = state.vibrance > 0 ? '#808080' : '#404040';
        ctx.fillRect(0, 0, w, h);
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
      }

      /* Vignette */
      if (state.vignette > 2) {
        var vAlpha = state.vignette / 100 * 0.7;
        var gradient = ctx.createRadialGradient(w/2, h/2, w*0.25, w/2, h/2, w*0.75);
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,' + vAlpha + ')');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);
      }

      /* Film Grain */
      if (state.grain > 2) {
        ctx.save();
        ctx.globalCompositeOperation = 'overlay';
        ctx.globalAlpha = (state.grain / 100) * 0.3;
        var grainPattern = ctx.createPattern(grainCanvas, 'repeat');
        ctx.fillStyle = grainPattern;
        ctx.fillRect(0, 0, w, h);
        ctx.restore();
      }

      ctx.restore();

      /* Stickers */
      var stickerSize = Math.max(w, h) * 0.08;
      ctx.font = stickerSize + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      state.stickers.forEach(function(s) {
        ctx.fillText(s.emoji, s.x * w, s.y * h);
      });

      /* Text Overlay */
      if (state.textOverlay) {
        var fontSize = Math.max(w, h) * 0.05;
        ctx.font = 'bold ' + fontSize + 'px Atkinson Hyperlegible, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillText(state.textOverlay, w/2 + 2, h - 30 + 2);
        ctx.fillStyle = state.textColor;
        ctx.fillText(state.textOverlay, w/2, h - 30);
      }
    }

    /* ========== UI SYNC ========== */
    function syncUIFromState() {
      document.querySelectorAll('input[type="range"]').forEach(function(slider) {
        var key = slider.getAttribute('data-key');
        if (state.hasOwnProperty(key)) {
          slider.value = state[key];
          var valSpan = slider.parentElement.querySelector('.val');
          if (valSpan) valSpan.textContent = key === 'rotation' ? state[key] + '°' : state[key];
        }
      });
      document.getElementById('blendMode').value = state.blendMode;
      document.getElementById('textInput').value = state.textOverlay;
      document.querySelectorAll('.color-dot').forEach(function(dot) {
        dot.classList.toggle('active', dot.getAttribute('data-color') === state.textColor);
      });
    }

    function readUI() {
      document.querySelectorAll('input[type="range"]').forEach(function(slider) {
        var key = slider.getAttribute('data-key');
        if (state.hasOwnProperty(key)) {
          state[key] = parseInt(slider.value);
        }
      });
      state.blendMode = document.getElementById('blendMode').value;
      state.textOverlay = document.getElementById('textInput').value;
    }

    /* ========== HISTORY ========== */
    function pushHistory() {
      var snapshot = JSON.parse(JSON.stringify(state));
      if (historyIndex < history.length - 1) {
        history = history.slice(0, historyIndex + 1);
      }
      history.push(snapshot);
      if (history.length > MAX_HISTORY) history.shift();
      historyIndex = history.length - 1;
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        state = JSON.parse(JSON.stringify(history[historyIndex]));
        syncUIFromState();
        renderCanvas();
      }
    }

    function redo() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        state = JSON.parse(JSON.stringify(history[historyIndex]));
        syncUIFromState();
        renderCanvas();
      }
    }

    /* ========== EVENTS ========== */
    document.querySelectorAll('input[type="range"]').forEach(function(slider) {
      slider.addEventListener('input', function() {
        var key = this.getAttribute('data-key');
        var valSpan = this.parentElement.querySelector('.val');
        if (valSpan) valSpan.textContent = key === 'rotation' ? this.value + '°' : this.value;
        readUI();
        renderCanvas();
      });
      slider.addEventListener('change', function() {
        pushHistory();
        updateRoomCode();
      });
    });

    document.getElementById('blendMode').addEventListener('change', function() {
      readUI();
      renderCanvas();
      pushHistory();
      updateRoomCode();
    });

    document.getElementById('textInput').addEventListener('input', function() {
      readUI();
      renderCanvas();
    });
    document.getElementById('textInput').addEventListener('change', function() {
      pushHistory();
      updateRoomCode();
    });

    document.querySelectorAll('.color-dot').forEach(function(dot) {
      dot.addEventListener('click', function() {
        document.querySelectorAll('.color-dot').forEach(function(d) { d.classList.remove('active'); });
        this.classList.add('active');
        state.textColor = this.getAttribute('data-color');
        renderCanvas();
        pushHistory();
        updateRoomCode();
      });
    });

    document.querySelectorAll('.sticker-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var emoji = this.getAttribute('data-sticker');
        state.stickers.push({
          emoji: emoji,
          x: 0.3 + Math.random() * 0.4,
          y: 0.3 + Math.random() * 0.4
        });
        renderCanvas();
        pushHistory();
        updateRoomCode();
      });
    });

    /* Canvas click to place stickers more precisely */
    canvas.addEventListener('click', function(e) {
      if (state.stickers.length === 0) return;
      var rect = canvas.getBoundingClientRect();
      var x = (e.clientX - rect.left) / rect.width;
      var y = (e.clientY - rect.top) / rect.height;
      state.stickers[state.stickers.length - 1].x = x;
      state.stickers[state.stickers.length - 1].y = y;
      renderCanvas();
      pushHistory();
      updateRoomCode();
    });

    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('redoBtn').addEventListener('click', redo);

    /* File Upload */
    document.getElementById('fileInput').addEventListener('change', function(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(ev) {
        loadImage(ev.target.result);
      };
      reader.readAsDataURL(file);
    });

    /* ========== ROOM CODE / HASH ========== */
    function updateRoomCode() {
      var stateToEncode = {
        sliders: {
          exposure: state.exposure, contrast: state.contrast,
          highlights: state.highlights, shadows: state.shadows,
          temperature: state.temperature, tint: state.tint,
          saturation: state.saturation, vibrance: state.vibrance,
          clarity: state.clarity, vignette: state.vignette,
          grain: state.grain
        },
        blendMode: state.blendMode,
        rotation: state.rotation,
        stickers: state.stickers,
        textOverlay: state.textOverlay,
        textColor: state.textColor
      };
      try {
        var encoded = btoa(JSON.stringify(stateToEncode));
        window.location.hash = encoded;
        var shortCode = encoded.substring(0, 12) + '...';
        document.getElementById('roomCode').textContent = 'room: ' + shortCode;
      } catch(e) {
        document.getElementById('roomCode').textContent = 'room link ready';
      }
    }

    document.getElementById('copyLinkBtn').addEventListener('click', function() {
      var url = window.location.href;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function() {
          document.getElementById('copyLinkBtn').textContent = '✅ Copied!';
          setTimeout(function() {
            document.getElementById('copyLinkBtn').textContent = '🔗 Copy Link';
          }, 2000);
        });
      } else {
        var ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        document.getElementById('copyLinkBtn').textContent = '✅ Copied!';
        setTimeout(function() {
          document.getElementById('copyLinkBtn').textContent = '🔗 Copy Link';
        }, 2000);
      }
    });

    /* ========== EXPORT ========== */
    document.getElementById('exportBtn').addEventListener('click', function() {
      var exportCanvas = document.createElement('canvas');
      exportCanvas.width = canvas.width;
      exportCanvas.height = canvas.height;
      var ectx = exportCanvas.getContext('2d');
      ectx.drawImage(canvas, 0, 0);

      /* Watermark */
      var w = exportCanvas.width;
      var h = exportCanvas.height;
      var pillH = Math.max(28, h * 0.04);
      var pillPad = pillH * 0.5;
      ectx.font = 'bold ' + (pillH * 0.55) + 'px Atkinson Hyperlegible, sans-serif';
      var wmText = '✨ Made with RIVLUM';
      var tw = ectx.measureText(wmText).width;
      var pillW = tw + pillPad * 2;
      var px = w - pillW - pillPad;
      var py = h - pillH - pillPad;

      ectx.save();
      ectx.globalAlpha = 0.6;
      if (ectx.roundRect) {
        ectx.beginPath();
        ectx.roundRect(px, py, pillW, pillH, pillH / 2);
        ectx.fillStyle = '#2D312E';
        ectx.fill();
      } else {
        ectx.fillStyle = '#2D312E';
        ectx.fillRect(px, py, pillW, pillH);
      }
      ectx.globalAlpha = 0.9;
      ectx.fillStyle = '#FFFFFF';
      ectx.textAlign = 'left';
      ectx.textBaseline = 'middle';
      ectx.fillText(wmText, px + pillPad, py + pillH / 2);
      ectx.restore();

      var link = document.createElement('a');
      link.download = 'rivlum-room-edit.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    });

    /* ========== START ========== */
    init();
  </script>

</body>
</html>
