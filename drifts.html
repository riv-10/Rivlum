<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Drifts · RIVLUM</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Atkinson Hyperlegible', sans-serif; padding-bottom: 7rem; }

    .drifts-close {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      font-size: 1.2rem;
      box-shadow: 0 2px 10px var(--shadow);
    }
    .drifts-close:active { transform: scale(0.95); }

    .drifts-hero {
      text-align: center;
      padding: 3.5rem 1.5rem 1.5rem;
      background: linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
    }
    .drifts-hero h2 {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: var(--accent);
      margin: 0 0 0.25rem;
    }
    .drifts-hero p {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }
    .drifts-stats {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      color: var(--text);
    }
    .stat-pill.gold {
      background: var(--gold-bg);
      border-color: var(--gold);
    }

    .share-portfolio-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.75rem;
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 999px;
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .share-portfolio-btn:hover { opacity: 0.9; }
    .share-portfolio-btn:active { transform: scale(0.97); }

    .drifts-grid {
      max-width: 680px;
      margin: 0 auto;
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .drift-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px var(--shadow);
      transition: transform 0.15s;
    }
    .drift-card:hover { transform: translateY(-2px); }

    .drift-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--bg2);
    }
    .drift-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .drift-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(45,49,46,0.75);
      color: white;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
    }

    .drift-info {
      padding: 0.85rem 1rem;
    }
    .drift-info .drift-title {
      font-family: 'Caveat', cursive;
      font-size: 1.15rem;
      color: var(--text);
      margin: 0 0 0.2rem;
    }
    .drift-info .drift-date {
      font-size: 0.78rem;
      color: var(--muted);
      margin: 0 0 0.5rem;
    }
    .drift-info .drift-sliders {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.65rem;
    }
    .slider-tag {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.15rem 0.45rem;
      font-size: 0.68rem;
      color: var(--muted);
      font-family: monospace;
    }
    .slider-tag.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(91,130,102,0.08);
    }

    .drift-actions {
      display: flex;
      gap: 0.4rem;
    }
    .drift-btn {
      flex: 1;
      padding: 0.45rem 0.3rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.78rem;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .drift-btn:hover { background: var(--bg2); }
    .drift-btn.danger { color: #c0392b; border-color: #e8c4c0; }
    .drift-btn.danger:hover { background: #fdf0ef; }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem 1.5rem;
      max-width: 400px;
      margin: 0 auto;
    }
    .empty-state .empty-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 0.75rem;
    }
    .empty-state h3 {
      font-family: 'Caveat', cursive;
      font-size: 1.6rem;
      color: var(--text);
      margin: 0 0 0.5rem;
    }
    .empty-state p {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
      margin: 0 0 1rem;
    }
    .empty-state a {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      background: var(--accent);
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-size: 0.9rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent);
      color: white;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-family: 'Caveat', cursive;
      font-size: 1.1rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
      z-index: 500;
      max-width: 90%;
      text-align: center;
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.85);
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 12px;
      object-fit: contain;
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clear-all-wrap {
      text-align: center;
      padding: 1rem;
    }
    .clear-all-btn {
      padding: 0.5rem 1rem;
      border: 1px solid #e8c4c0;
      border-radius: 8px;
      background: transparent;
      color: #c0392b;
      font-family: 'Atkinson Hyperlegible', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .clear-all-btn:hover { background: #fdf0ef; }

    @media (max-width: 400px) {
      .drifts-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <script>
    (function(){
      var t = localStorage.getItem('rivlum_theme') || 'meadow';
      document.body.setAttribute('data-theme', t);
      if (localStorage.getItem('rivlum_dys') === '1') document.body.classList.add('dyslexia-font');
      if (localStorage.getItem('rivlum_motion') === '1') document.body.classList.add('reduced-motion');
    })();
  </script>

  <a href="index.html" class="drifts-close" aria-label="Go home">✕</a>

  <section class="drifts-hero">
    <h2>my drifts 🌊</h2>
    <p>every edit you've saved lives here</p>
    <div class="drifts-stats" id="driftStats"></div>
    <button class="share-portfolio-btn" id="sharePortfolioBtn" style="display:none;">🔗 Share Portfolio Link</button>
  </section>

  <div id="driftsContainer"></div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img id="lightboxImg" src="" alt="drift preview">
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Footer -->
  <footer class="pretty-footer">
    <span class="footer-emoji">🌿</span>
    <span class="footer-script">every drift tells a story</span>
    <span class="footer-copy">© 2026 RIVLUM · <a href="privacy.html">Privacy Oath</a></span>
  </footer>

  <!-- Nav -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="challenge.html" class="nav-item"><span class="nav-icon">✨</span><span class="nav-label">Edit</span></a>
    <a href="free-edit.html" class="nav-item"><span class="nav-icon">📸</span><span class="nav-label">Free</span></a>
    <a href="room.html" class="nav-item"><span class="nav-icon">⚡</span><span class="nav-label">Room</span></a>
    <a href="constellation.html" class="nav-item"><span class="nav-icon">🌌</span><span class="nav-label">Sky</span></a>
    <a href="about.html" class="nav-item"><span class="nav-icon">💛</span><span class="nav-label">About</span></a>
  </nav>

  <script>
    /* ========== CHALLENGE NAMES ========== */
    var CHALLENGE_LABELS = {
      prism: '☁️ Prism',
      horizon: '🌅 Horizon',
      mask: '🌙 Mask',
      frame: '⚡ Frame',
      grove: '🌿 Grove',
      reel: '📼 Reel',
      free: '📸 Free Edit'
    };

    var SLIDER_NAMES = {
      exposure: 'Exp', contrast: 'Con', highlights: 'Hi', shadows: 'Sh',
      temperature: 'Temp', tint: 'Tint', saturation: 'Sat', vibrance: 'Vib',
      clarity: 'Clr', vignette: 'Vig', grain: 'Grn'
    };

    /* ========== TOAST ========== */
    var toast = document.getElementById('toast');
    var toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
    }

    /* ========== LOAD DRIFTS ========== */
    function loadDrifts() {
      var drifts = [];
      try {
        drifts = JSON.parse(localStorage.getItem('rivlum_drifts') || '[]');
      } catch(e) {}
      return drifts;
    }

    /* ========== RENDER STATS ========== */
    function renderStats(drifts) {
      var wrap = document.getElementById('driftStats');
      var streak = parseInt(localStorage.getItem('rivlum_streak') || '0');
      var stars = [];
      try { stars = JSON.parse(localStorage.getItem('rivlum_stars') || '[]'); } catch(e) {}
      var born = localStorage.getItem('rivlum_born');
      var days = born ? Math.max(1, Math.floor((Date.now() - parseInt(born)) / 86400000)) : 0;

      var html = '<span class="stat-pill">📸 ' + drifts.length + ' drifts</span>';
      html += '<span class="stat-pill">⭐ ' + stars.length + ' stars</span>';
      if (streak > 0) html += '<span class="stat-pill gold">🔥 ' + streak + '-day chain</span>';
      if (days > 0) html += '<span class="stat-pill">🌱 ' + days + ' days creating</span>';
      wrap.innerHTML = html;

      var shareBtn = document.getElementById('sharePortfolioBtn');
      shareBtn.style.display = drifts.length > 0 ? 'inline-flex' : 'none';
    }

    /* ========== RENDER GALLERY ========== */
    function renderGallery() {
      var drifts = loadDrifts();
      var container = document.getElementById('driftsContainer');
      renderStats(drifts);

      if (drifts.length === 0) {
        container.innerHTML =
          '<div class="empty-state">' +
            '<span class="empty-emoji">🌊</span>' +
            '<h3>no drifts yet</h3>' +
            '<p>every edit you save will appear here like a little gallery of your creative journey. go make something beautiful!</p>' +
            '<a href="free-edit.html">start editing ✨</a>' +
          '</div>';
        return;
      }

      var html = '<div class="drifts-grid">';
      drifts.forEach(function(drift, idx) {
        var label = CHALLENGE_LABELS[drift.challenge] || drift.challenge;
        var dateStr = '';
        try {
          var d = new Date(drift.date);
          dateStr = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        } catch(e) {
          dateStr = 'recently';
        }

        var sliderTags = '';
        if (drift.sliders) {
          Object.keys(drift.sliders).forEach(function(k) {
            var v = drift.sliders[k];
            if (v !== 0) {
              var name = SLIDER_NAMES[k] || k;
              sliderTags += '<span class="slider-tag active">' + name + ' ' + (v > 0 ? '+' : '') + v + '</span>';
            }
          });
        }
        if (drift.grain && !drift.sliders) {
          sliderTags += '<span class="slider-tag active">Grn +' + drift.grain + '</span>';
        }
        if (!sliderTags) {
          sliderTags = '<span class="slider-tag">no adjustments</span>';
        }

        var imgSrc = drift.image || '';

        html +=
          '<div class="drift-card" data-idx="' + idx + '">' +
            '<div class="drift-img-wrap">' +
              '<img src="' + imgSrc + '" alt="saved drift" loading="lazy" onerror="this.style.display=\'none\'">' +
              '<span class="drift-badge">' + label + '</span>' +
            '</div>' +
            '<div class="drift-info">' +
              '<p class="drift-title">' + label + '</p>' +
              '<p class="drift-date">' + dateStr + '</p>' +
              '<div class="drift-sliders">' + sliderTags + '</div>' +
              '<div class="drift-actions">' +
                '<button class="drift-btn" onclick="viewDrift(' + idx + ')">👁️ View</button>' +
                '<button class="drift-btn" onclick="shareDrift(' + idx + ')">🔗 Share</button>' +
                '<button class="drift-btn" onclick="restoreDrift(' + idx + ')">🔄 Edit</button>' +
                '<button class="drift-btn danger" onclick="deleteDrift(' + idx + ')">🗑️</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      });
      html += '</div>';

      html += '<div class="clear-all-wrap"><button class="clear-all-btn" onclick="clearAllDrifts()">🧹 Clear All Drifts</button></div>';

      container.innerHTML = html;
    }

    /* ========== ACTIONS ========== */
    function viewDrift(idx) {
      var drifts = loadDrifts();
      if (!drifts[idx] || !drifts[idx].image) return;
      document.getElementById('lightboxImg').src = drifts[idx].image;
      document.getElementById('lightbox').classList.add('open');
    }

    document.getElementById('lightboxClose').addEventListener('click', function() {
      document.getElementById('lightbox').classList.remove('open');
    });
    document.getElementById('lightbox').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    function shareDrift(idx) {
      var drifts = loadDrifts();
      if (!drifts[idx]) return;
      var label = CHALLENGE_LABELS[drifts[idx].challenge] || 'RIVLUM';
      var text = '✨ check out my ' + label + ' edit on RIVLUM — the river of light 🌊';
      var url = window.location.origin + window.location.pathname;

      if (navigator.share) {
        navigator.share({ title: 'My RIVLUM Drift', text: text, url: url }).catch(function(){});
      } else {
        var waUrl = 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + url);
        window.open(waUrl, '_blank');
      }
      showToast('🔗 sharing your drift!');
    }

    function restoreDrift(idx) {
      var drifts = loadDrifts();
      if (!drifts[idx]) return;
      localStorage.setItem('rivlum_restore', JSON.stringify(drifts[idx]));
      window.location.href = 'free-edit.html?restore=1';
    }

    function deleteDrift(idx) {
      if (!confirm('delete this drift? it\'ll be gone forever 🥺')) return;
      var drifts = loadDrifts();
      drifts.splice(idx, 1);
      localStorage.setItem('rivlum_drifts', JSON.stringify(drifts));
      renderGallery();
      showToast('🗑️ drift removed');
    }

    function clearAllDrifts() {
      if (!confirm('delete ALL drifts? this can\'t be undone 💔')) return;
      localStorage.removeItem('rivlum_drifts');
      renderGallery();
      showToast('🧹 all drifts cleared');
    }

    /* ========== SHARE PORTFOLIO ========== */
    document.getElementById('sharePortfolioBtn').addEventListener('click', function() {
      var drifts = loadDrifts();
      var stars = [];
      try { stars = JSON.parse(localStorage.getItem('rivlum_stars') || '[]'); } catch(e) {}
      var text = '🌊 my RIVLUM portfolio: ' + drifts.length + ' drifts, ' + stars.length + ' stars unlocked. the river of light ✨';
      var url = window.location.origin + '/drifts.html';

      if (navigator.share) {
        navigator.share({ title: 'My RIVLUM Portfolio', text: text, url: url }).catch(function(){});
      } else {
        var waUrl = 'https://wa.me/?text=' + encodeURIComponent(text + ' ' + url);
        window.open(waUrl, '_blank');
      }
      showToast('🔗 portfolio link shared!');
    });

    /* ========== INIT ========== */
    renderGallery();
  </script>

</body>
</html>
