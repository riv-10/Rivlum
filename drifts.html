<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIVLUM — Portfolio & Drifts</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { font-family: 'Atkinson Hyperlegible', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#FBF8F3; color:#2D312E; margin:0; padding:0; padding-bottom:80px; }
  .wrap { max-width:800px; margin:0 auto; padding:16px; }
  .header-card { background:#FFFFFF; border:1px solid #EAE4DC; border-radius:12px; padding:16px; margin-bottom:16px; text-align:center; }
  .header-card h1 { margin:0 0 6px 0; color:#5B8266; font-size:1.4rem; }
  .header-card p { margin:0 0 12px 0; color:#6E7570; font-size:0.9rem; }
  .share-bar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .btn { padding:8px 16px; border-radius:8px; border:none; cursor:pointer; font-size:0.85rem; font-weight:bold; font-family:inherit; }
  .btn-primary { background:#5B8266; color:#fff; }
  .btn-accent { background:#D97D54; color:#fff; }
  .btn-secondary { background:#f5f5f5; border:1px solid #ddd; color:#2D312E; }
  .gallery-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:14px; margin-top:16px; }
  .drift-card { background:#FFFFFF; border:1px solid #EAE4DC; border-radius:12px; padding:12px; box-shadow:0 2px 8px rgba(0,0,0,0.03); }
  .drift-card img { width:100%; height:180px; object-fit:cover; border-radius:8px; margin-bottom:10px; }
  .shared-banner { background:#FFF6D6; border:1px solid #F2C94C; padding:10px 14px; border-radius:10px; margin-bottom:16px; font-size:0.85rem; color:#2D312E; text-align:center; }
  .nav { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #EAE4DC; display:flex; justify-content:space-around; padding:8px 0; z-index:100; }
  .nav a { text-decoration:none; color:#5B8266; font-size:0.75rem; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .nav a span { font-size:1.2rem; }
</style>
</head>
<body>

<div class="wrap">
  
  <div id="sharedBanner" class="shared-banner" style="display:none;">
    ✨ <strong>Viewing Shared Portfolio</strong> — Created with RIVLUM! No account needed.
  </div>

  <div class="header-card">
    <h1 id="portfolioTitle">🧭 My Drift Portfolio</h1>
    <p id="portfolioSubtitle">Your collected creative photo edits saved locally in your browser.</p>
    
    <div class="share-bar">
      <button class="btn btn-primary" onclick="sharePortfolio()">🔗 Share Portfolio Link</button>
      <a href="free-edit.html" class="btn btn-accent" style="text-decoration:none; display:inline-block;">📸 Create New Edit</a>
    </div>
  </div>

  <div id="driftGallery" class="gallery-grid"></div>

</div>

<!-- MASTER NAV -->
<nav class="nav">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="challenge.html"><span>✨</span>Edit</a>
  <a href="free-edit.html"><span>📸</span>Free</a>
  <a href="constellation.html"><span>🌌</span>Sky</a>
  <a href="about.html"><span>💛</span>About</a>
</nav>

<script>
// ==========================================
// ZERO-LOGIN PORTFOLIO ENGINE (TIER 2)
// ==========================================

let isSharedView = false;

function initGallery() {
  const hash = window.location.hash;
  
  // Check if opening a shared portfolio URL link
  if (hash.startsWith('#portfolio=')) {
    isSharedView = true;
    document.getElementById('sharedBanner').style.display = 'block';
    document.getElementById('portfolioTitle').textContent = '🎨 Shared Creative Portfolio';
    document.getElementById('portfolioSubtitle').textContent = 'Explore these edits created on RIVLUM.';
    
    try {
      const encodedData = hash.replace('#portfolio=', '');
      const decodedJson = decodeURIComponent(atob(encodedData));
      const sharedDrifts = JSON.parse(decodedJson);
      renderDriftsList(sharedDrifts, true);
    } catch (e) {
      alert('Unable to load shared portfolio link.');
      loadLocalGallery();
    }
  } else {
    loadLocalGallery();
  }
}

function loadLocalGallery() {
  const localDrifts = JSON.parse(localStorage.getItem('rivlum_drifts') || '[]');
  renderDriftsList(localDrifts, false);
}

function renderDriftsList(drifts, readOnly) {
  const gallery = document.getElementById('driftGallery');
  
  if (!drifts || drifts.length === 0) {
    gallery.innerHTML = `
      <div style="grid-column:1/-1; text-align:center; padding:40px 20px; color:#6E7570;">
        <p style="font-size:1.1rem; margin-bottom:8px;">✨ No saved edits in this portfolio yet!</p>
        <p style="font-size:0.85rem; margin-bottom:14px;">Edit a photo and hit <strong>Save</strong> to add your work here.</p>
        <a href="free-edit.html" class="btn btn-primary" style="text-decoration:none;">📸 Start Editing</a>
      </div>`;
    return;
  }
  
  gallery.innerHTML = drifts.map((drift, index) => `
    <div class="drift-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong style="color:#5B8266;">Drift #${index + 1}</strong>
        <small style="color:#6E7570;">${new Date(drift.date || Date.now()).toLocaleDateString()}</small>
      </div>
      ${drift.image ? `<img src="${drift.image}" alt="Saved Edit">` : ''}
      <div style="display:flex; gap:6px; flex-wrap:wrap;">
        <button onclick="reEditDrift(${index}, ${readOnly})" class="btn btn-primary" style="flex:1; padding:6px; font-size:0.8rem;">🎨 Re-Edit</button>
        <button onclick="downloadDriftImage('${drift.image}')" class="btn btn-secondary" style="padding:6px 10px; font-size:0.8rem;">⬇</button>
        ${!readOnly ? `<button onclick="deleteDrift(${index})" class="btn btn-secondary" style="padding:6px 10px; font-size:0.8rem; color:#D97D54;">🗑</button>` : ''}
      </div>
    </div>
  `).join('');
}

// Generate Zero-Login Portfolio URL
async function sharePortfolio() {
  const localDrifts = JSON.parse(localStorage.getItem('rivlum_drifts') || '[]');
  if (localDrifts.length === 0) {
    return alert('Your portfolio is currently empty! Create and save an edit first.');
  }

  // Sanitize drifts payload (keep images clean for lightweight URL)
  const minimalDrifts = localDrifts.map(d => ({
    date: d.date,
    sliders: d.sliders,
    image: d.image // compressed base64 thumbnail
  }));

  try {
    const jsonString = JSON.stringify(minimalDrifts);
    const encoded = btoa(encodeURIComponent(jsonString));
    const portfolioUrl = `${window.location.origin}${window.location.pathname}#portfolio=${encoded}`;

    if (navigator.share) {
      await navigator.share({
        title: 'My RIVLUM Photo Portfolio',
        text: 'Check out my creative photo edits on RIVLUM! (No signup needed):',
        url: portfolioUrl
      });
    } else {
      await navigator.clipboard.writeText(portfolioUrl);
      alert('📋 Portfolio Link Copied to Clipboard! Share it on WhatsApp or Instagram.');
    }
  } catch (err) {
    alert('Share dismissed or portfolio data too large for single URL.');
  }
}

function reEditDrift(index, readOnly) {
  let drifts = [];
  if (readOnly) {
    const hash = window.location.hash.replace('#portfolio=', '');
    drifts = JSON.parse(decodeURIComponent(atob(hash)));
  } else {
    drifts = JSON.parse(localStorage.getItem('rivlum_drifts') || '[]');
  }
  
  if (!drifts[index]) return;
  localStorage.setItem('rivlum_restore', JSON.stringify(drifts[index]));
  window.location.href = 'free-edit.html?restore=1';
}

function downloadDriftImage(imgSrc) {
  if (!imgSrc) return alert('No image data found.');
  const link = document.createElement('a');
  link.download = `rivlum-drift-${Date.now()}.png`;
  link.href = imgSrc;
  link.click();
}

function deleteDrift(index) {
  if (!confirm('Delete this Drift from your local gallery?')) return;
  const drifts = JSON.parse(localStorage.getItem('rivlum_drifts') || '[]');
  drifts.splice(index, 1);
  localStorage.setItem('rivlum_drifts', JSON.stringify(drifts));
  loadLocalGallery();
}

window.addEventListener('load', initGallery);
</script>

</body>
</html>
