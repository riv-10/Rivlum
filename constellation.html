<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Map · RIVLUM</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0B0E14; color: #E8E4DF; font-family: 'Atkinson Hyperlegible', sans-serif; padding-bottom: 5rem; overflow-x: hidden; }

    .sky-close {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 200;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 1.5px solid rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #E8E4DF;
      font-size: 1.2rem;
      backdrop-filter: blur(8px);
    }
    .sky-close:active { transform: scale(0.95); }

    .sky-hero {
      text-align: center;
      padding: 3.5rem 1.5rem 1rem;
      position: relative;
      z-index: 10;
    }
    .sky-hero h2 {
      font-family: 'Caveat', cursive;
      font-size: 2.2rem;
      color: #F2C94C;
      margin: 0 0 0.25rem;
    }
    .sky-hero p {
      color: rgba(232,228,223,0.6);
      font-size: 0.9rem;
      margin: 0;
    }

    .sky-pills {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .sky-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 999px;
      padding: 0.25rem 0.7rem;
      font-size: 0.78rem;
      color: #E8E4DF;
    }
    .sky-pill.gold {
      background: rgba(242,201,76,0.15);
      border-color: rgba(242,201,76,0.4);
      color: #F2C94C;
    }

    /* Starfield Canvas */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Constellation Map */
    .constellation-map {
      position: relative;
      z-index: 10;
      max-width: 500px;
      margin: 1rem auto;
      padding: 1rem;
      min-height: 420px;
    }

    .star-node {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
      text-decoration: none;
    }
    .star-node:hover { transform: scale(1.1); }
    .star-node:active { transform: scale(0.95); }

    .star-glow {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      position: relative;
    }
    .star-glow.locked {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.15);
    }
    .star-glow.unlocked {
      background: rgba(242,201,76,0.2);
      border: 2px solid #F2C94C;
      box-shadow: 0 0 20px rgba(242,201,76,0.3), 0 0 40px rgba(242,201,76,0.1);
    }
    .star-glow.unlocked::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(242,201,76,0.15);
      animation: pulse-ring 2.5s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 0; }
    }

    .star-label {
      margin-top: 0.35rem;
      font-family: 'Caveat', cursive;
      font-size: 0.95rem;
      color: rgba(232,228,223,0.7);
      white-space: nowrap;
    }
    .star-node.unlocked .star-label {
      color: #F2C94C;
    }
    .star-status {
      font-size: 0.68rem;
      color: rgba(232,228,223,0.4);
      margin-top: 0.1rem;
    }
    .star-node.unlocked .star-status {
      color: rgba(242,201,76,0.6);
    }

    /* Connecting Lines (SVG) */
    .constellation-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
    }
    .constellation-lines line {
      stroke: rgba(255,255,255,0.08);
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }
    .constellation-lines line.lit {
      stroke: rgba(242,201,76,0.25);
      stroke-dasharray: none;
    }

    /* Progress Section */
    .progress-section {
      position: relative;
      z-index: 10;
      max-width: 500px;
      margin: 0 auto;
      padding: 0 1rem 1.5rem;
    }
    .progress-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 1.25rem;
      backdrop-filter: blur(8px);
    }
    .progress-card h3 {
      font-family: 'Caveat', cursive;
      font-size: 1.3rem;
      color: #F2C94C;
      margin: 0 0 0.75rem;
    }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #F2C94C, #D07251);
      transition: width 0.6s ease;
    }
    .progress-text {
      font-size: 0.82rem;
      color: rgba(232,228,223,0.5);
      text-align: center;
    }

    .sky-footer-spacer { height: 2rem; }

    /* Override footer colors for dark sky */
    .pretty-footer {
      background: rgba(255,255,255,0.03) !important;
      border-top: 1px solid rgba(255,255,255,0.08) !important;
    }
    .pretty-footer .footer-script,
    .pretty-footer .footer-copy,
    .pretty-footer .footer-copy a {
      color: rgba(232,228,223,0.4) !important;
    }

    /* Bottom nav override for dark bg */
    .bottom-nav {
      background: rgba(11,14,20,0.95) !important;
      border-top: 1px solid rgba(255,255,255,0.08) !important;
      backdrop-filter: blur(12px);
    }
    .bottom-nav .nav-label {
      color: rgba(232,228,223,0.5) !important;
    }
    .bottom-nav .nav-item.active .nav-label {
      color: #F2C94C !important;
    }

    @media (prefers-reduced-motion: reduce), (.reduced-motion *) {
      .star-glow.unlocked::after { animation: none; }
    }
  </style>
</head>
<body>

  <script>
    (function(){
      var t = localStorage.getItem('rivlum_theme') || 'meadow';
      document.body.setAttribute('data-theme', t);
      if (localStorage.getItem('rivlum_dys') === '1') document.body.classList.add('dyslexia-font');
      if (localStorage.getItem('rivlum_motion') === '1') document.body.classList.add('reduced-motion');
    })();
  </script>

  <a href="index.html" class="sky-close" aria-label="Go home">✕</a>

  <canvas id="starfield"></canvas>

  <section class="sky-hero">
    <h2>your sky map 🌌</h2>
    <p>every challenge you complete lights up a new star</p>
    <div class="sky-pills" id="skyPills"></div>
  </section>

  <div class="constellation-map" id="constellationMap">
    <svg class="constellation-lines" id="constellationLines" viewBox="0 0 500 420" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="progress-section">
    <div class="progress-card">
      <h3>✨ constellation progress</h3>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill" style="width: 0%"></div>
      </div>
      <p class="progress-text" id="progressText">0 of 6 stars lit</p>
    </div>
  </div>

  <div class="sky-footer-spacer"></div>

  <footer class="pretty-footer">
    <span class="footer-emoji">🌿</span>
    <span class="footer-script">the sky grows brighter with every edit</span>
    <span class="footer-copy">© 2026 RIVLUM · <a href="privacy.html">Privacy Oath</a></span>
  </footer>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></a>
    <a href="challenge.html" class="nav-item"><span class="nav-icon">✨</span><span class="nav-label">Edit</span></a>
    <a href="free-edit.html" class="nav-item"><span class="nav-icon">📸</span><span class="nav-label">Free</span></a>
    <a href="room.html" class="nav-item"><span class="nav-icon">⚡</span><span class="nav-label">Room</span></a>
    <a href="constellation.html" class="nav-item active" aria-current="page"><span class="nav-icon">🌌</span><span class="nav-label">Sky</span></a>
    <a href="about.html" class="nav-item"><span class="nav-icon">💛</span><span class="nav-label">About</span></a>
  </nav>

  <script>
    /* ========== STARFIELD ANIMATION ========== */
    (function() {
      var c = document.getElementById('starfield');
      var ctx = c.getContext('2d');
      var stars = [];
      var NUM_STARS = 120;

      function resize() {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      for (var i = 0; i < NUM_STARS; i++) {
        stars.push({
          x: Math.random() * c.width,
          y: Math.random() * c.height,
          r: Math.random() * 1.5 + 0.3,
          alpha: Math.random() * 0.7 + 0.3,
          speed: Math.random() * 0.005 + 0.002,
          phase: Math.random() * Math.PI * 2
        });
      }

      var reducedMotion = localStorage.getItem('rivlum_motion') === '1';

      function draw(time) {
        ctx.clearRect(0, 0, c.width, c.height);
        stars.forEach(function(s) {
          var twinkle = reducedMotion ? s.alpha : s.alpha * (0.6 + 0.4 * Math.sin(time * s.speed + s.phase));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(232,228,223,' + twinkle + ')';
          ctx.fill();
        });
        if (!reducedMotion) {
          requestAnimationFrame(draw);
        }
      }
      requestAnimationFrame(draw);
    })();

    /* ========== CONSTELLATION DATA ========== */
    var NODES = [
      { key: 'prism', emoji: '☁️', name: 'Prism', x: 25, y: 12 },
      { key: 'horizon', emoji: '🌅', name: 'Horizon', x: 70, y: 8 },
      { key: 'mask', emoji: '🌙', name: 'Mask', x: 15, y: 42 },
      { key: 'frame', emoji: '⚡', name: 'Frame', x: 55, y: 38 },
      { key: 'grove', emoji: '🌿', name: 'Grove', x: 82, y: 45 },
      { key: 'reel', emoji: '📼', name: 'Reel', x: 48, y: 72 }
    ];

    var EDGES = [
      [0, 1], [0, 2], [1, 3], [2, 3], [3, 4], [2, 5], [3, 5], [4, 5]
    ];

    /* ========== LOAD STARS ========== */
    function getUnlockedStars() {
      try {
        return JSON.parse(localStorage.getItem('rivlum_stars') || '[]');
      } catch(e) {
        return [];
      }
    }

    /* ========== RENDER PILLS ========== */
    function renderPills() {
      var unlocked = getUnlockedStars();
      var streak = parseInt(localStorage.getItem('rivlum_streak') || '0');
      var drifts = [];
      try { drifts = JSON.parse(localStorage.getItem('rivlum_drifts') || '[]'); } catch(e) {}

      var html = '<span class="sky-pill">⭐ ' + unlocked.length + '/6 stars</span>';
      html += '<span class="sky-pill">📸 ' + drifts.length + ' drifts</span>';
      if (streak > 0) html += '<span class="sky-pill gold">🔥 ' + streak + '-day chain</span>';
      document.getElementById('skyPills').innerHTML = html;
    }
    renderPills();

    /* ========== RENDER CONSTELLATION ========== */
    function renderConstellation() {
      var unlocked = getUnlockedStars();
      var map = document.getElementById('constellationMap');
      var svg = document.getElementById('constellationLines');

      /* Clear old nodes (keep SVG) */
      var oldNodes = map.querySelectorAll('.star-node');
      oldNodes.forEach(function(n) { n.remove(); });

      /* Draw edges */
      var linesHtml = '';
      EDGES.forEach(function(edge) {
        var a = NODES[edge[0]];
        var b = NODES[edge[1]];
        var bothLit = unlocked.indexOf(a.key) !== -1 && unlocked.indexOf(b.key) !== -1;
        var ax = a.x * 5, ay = a.y * 4.2 + 24;
        var bx = b.x * 5, by = b.y * 4.2 + 24;
        linesHtml += '<line x1="'+ax+'" y1="'+ay+'" x2="'+bx+'" y2="'+by+'" class="'+(bothLit ? 'lit' : '')+'">';
      });
      svg.innerHTML = linesHtml;

      /* Draw nodes */
      NODES.forEach(function(node) {
        var isUnlocked = unlocked.indexOf(node.key) !== -1;
        var el = document.createElement('a');
        el.href = 'challenge.html?c=' + node.key;
        el.className = 'star-node' + (isUnlocked ? ' unlocked' : '');
        el.style.left = node.x + '%';
        el.style.top = node.y + '%';
        el.style.transform = 'translate(-50%, -50%)';

        el.innerHTML =
          '<div class="star-glow ' + (isUnlocked ? 'unlocked' : 'locked') + '">' +
            node.emoji +
          '</div>' +
          '<span class="star-label">' + node.name + '</span>' +
          '<span class="star-status">' + (isUnlocked ? '⭐ lit' : '○ locked') + '</span>';

        map.appendChild(el);
      });

      /* Progress */
      var pct = Math.round((unlocked.length / 6) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent = unlocked.length + ' of 6 stars lit' + (unlocked.length === 6 ? ' — complete constellation! 🎉' : '');
    }
    renderConstellation();
  </script>

</body>
</html>
